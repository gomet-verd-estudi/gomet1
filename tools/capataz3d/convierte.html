<body><script type="module">
// Convierte el FBX de Tripo (malla + esqueleto Mixamo) a GLB, sin texturas (la de color se trata aparte)

import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
const src = new URLSearchParams(location.search).get('fbx') || 'nuevo/modelo.fbx';

fbx.updateMatrixWorld(true);
fbx.traverse((o) => {

  if (o.isMesh) {
    const g = o.geometry; g.computeBoundingBox();
    const b = new THREE.Box3().setFromObject(o);
    info.meshes.push({ name: o.name, skinned: !!o.isSkinnedMesh, verts: g.attributes.position.count, tris: (g.index ? g.index.count : g.attributes.position.count) / 3, attrs: Object.keys(g.attributes), mats: (Array.isArray(o.material) ? o.material : [o.material]).map((m) => `${m.type}:${m.name}:${m.color ? m.color.getHexString() : ''}:${m.map ? 'map' : '-'}`), groups: g.groups.length,
      box: [b.min.toArray().map((x) => +x.toFixed(2)), b.max.toArray().map((x) => +x.toFixed(2))], bonesInSkin: o.skeleton ? o.skeleton.bones.length : 0 });

    for (const m of (Array.isArray(o.material) ? o.material : [o.material])) { m.map = null; m.normalMap = null; m.specularMap = null; m.emissiveMap = null; }
  }
});

window.OUT = { info, glb: btoa(s), bytes: u.length };
window.DONE = true;
</script></body></html>
