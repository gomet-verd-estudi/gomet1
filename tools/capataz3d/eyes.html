<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head>
<body><canvas id="c"></canvas><script type="module">
// Redibuja la cara sobre la textura: borra los ojos en «T» del modelo y pinta ojos ovalados con brillo y cejas;
// genera también la versión con los ojos cerrados (parpadeo). Las formas se dibujan en la vista frontal (600 × 600,
// zoom 3.2) y se proyectan sobre el modelo con rayos, así quedan pegadas a la cabeza.
import * as THREE from 'three';
import { createCapataz } from './capataz3d.js';
import { idle } from './capataz-anim.js';
const SKIN = [0xF4, 0xC2, 0xA4], DARK = [0x1B, 0x19, 0x19], WHITE = [255, 255, 255];
const C = await createCapataz({ canvas: document.getElementById('c'), url: './model.glb', texture: './flat-line-ojosT.png', relief: './relief.png' });
C.renderer.setPixelRatio(1); C.resize(600, 600); C.pose({}); C.view({ yaw: 0, zoom: 3.2, cy: 0.26 });
const img = new Image(); img.src = './flat-line-ojosT.png'; await img.decode();
const S = img.width, cv = document.createElement('canvas'); cv.width = cv.height = S;
const g = cv.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0);
const base = g.getImageData(0, 0, S, S);
// pasada de coordenadas de textura en la GPU: cada píxel guarda su (u, v) en 16 bits por canal; fondo = blanco
const SS = 2, W = 600 * SS;
const uvMat = new THREE.ShaderMaterial({
  vertexShader: `#include <common>
#include <skinning_pars_vertex>
varying vec2 vU;
void main(){ vU = uv;
#include <skinbase_vertex>
#include <begin_vertex>
#include <skinning_vertex>
#include <project_vertex>
}`,
  fragmentShader: `varying vec2 vU; void main(){ vec2 h = floor(vU * 255.) / 255.; vec2 l = fract(vU * 255.); gl_FragColor = vec4(h.x, l.x, h.y, l.y); }`,
  blending: THREE.NoBlending
});
const rtUV = new THREE.WebGLRenderTarget(W, W);
let buf = new Uint8Array(W * W * 4);
function uvPass(pose, view) {
  C.pose(pose); C.view(view);
  const keep = C.mesh.material; C.mesh.material = uvMat;
  C.renderer.setRenderTarget(rtUV); C.renderer.setClearColor(0xffffff, 1); C.renderer.clear(); C.renderer.render(C.scene, C.camera); C.renderer.setRenderTarget(null);
  C.mesh.material = keep; buf = new Uint8Array(W * W * 4); C.renderer.readRenderTargetPixels(rtUV, 0, 0, W, W, buf);
}
uvPass({}, { yaw: 0, zoom: 3.2, cy: 0.26 });
// (x, y) en la vista de 600 px, y hacia abajo; el búfer va de abajo arriba
const uvAt = (x, y) => {
  const X = Math.round(x * SS), Y = W - 1 - Math.round(y * SS); if (X < 0 || Y < 0 || X >= W || Y >= W) return null;
  const i = (Y * W + X) * 4; if (buf[i] === 255 && buf[i + 1] === 255 && buf[i + 2] === 255 && buf[i + 3] === 255) return null;
  return [(buf[i] + buf[i + 1] / 255) / 255 * S, (buf[i + 2] + buf[i + 3] / 255) / 255 * S];
};
function texels(inside, x0, y0, x1, y1) {
  const out = [];
  for (let y = y0; y <= y1; y += 0.5) for (let x = x0; x <= x1; x += 0.5) {
    if (!inside(x, y)) continue; const a = uvAt(x, y); if (!a) continue;
    const b = uvAt(x + 1, y); const r = b ? Math.min(6, Math.hypot(b[0] - a[0], b[1] - a[1])) : 2;
    out.push([a[0], a[1], r]);
  }
  return out;
}
function paint(data, pts, rgb, test) {
  for (const [u, v, r] of pts) {
    const rr = Math.max(1, r * 0.6);
    for (let dy = -Math.ceil(rr); dy <= Math.ceil(rr); dy++) for (let dx = -Math.ceil(rr); dx <= Math.ceil(rr); dx++) {
      if (dx * dx + dy * dy > rr * rr) continue;
      const X = Math.floor(u + dx), Y = Math.floor(v + dy); if (X < 0 || Y < 0 || X >= S || Y >= S) continue;
      const i = (Y * S + X) * 4; if (test && !test(data.data, i)) continue;
      data.data[i] = rgb[0]; data.data[i + 1] = rgb[1]; data.data[i + 2] = rgb[2]; data.data[i + 3] = 255;
    }
  }
}
const isDark = (d, i) => d[i] < 70 && d[i + 1] < 70 && d[i + 2] < 70;
const ell = (cx, cy, rx, ry) => (x, y) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1;
const band = (pts, w) => (x, y) => { // trazo grueso a lo largo de una polilínea
  for (let k = 1; k < pts.length; k++) { const [ax, ay] = pts[k - 1], [bx, by] = pts[k]; const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
    const t = Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / L)); if (Math.hypot(x - ax - t * dx, y - ay - t * dy) <= w / 2) return true; }
  return false;
};
const arc = (x0, x1, y, h, n = 12) => Array.from({ length: n + 1 }, (_, k) => { const t = k / n; return [x0 + (x1 - x0) * t, y - h * Math.sin(Math.PI * t)]; });
// 1) borrar los ojos en «T» (solo lo oscuro): de la visera al bigote, entre las patillas
const erase = texels((x, y) => x >= 142 && x <= 412 && y >= 122 && (y <= 252 || (y <= 258 && ((x > 180 && x < 255) || (x > 330 && x < 410)))), 142, 122, 412, 258);
paint(base, erase.map(([u, v, r]) => [u, v, r + 2.5]), SKIN, isDark);
// motas sueltas de los ojos viejos junto al bigote
paint(base, [...texels(ell(195, 245, 9, 9), 185, 235, 205, 255), ...texels(ell(403, 243, 8, 8), 394, 234, 412, 252)].map(([u, v, r]) => [u, v, r + 2]), SKIN);
// astillas: oscuros sueltos (menos del 35 % de oscuro alrededor, 11 × 11) pasan a piel
{ const d = base.data, n = S * S, I = new Uint32Array((S + 1) * (S + 1));
  for (let y = 0; y < S; y++) { let row = 0; for (let x = 0; x < S; x++) { const i = (y * S + x) * 4; row += (d[i] < 70 && d[i + 1] < 70 && d[i + 2] < 70) ? 1 : 0; I[(y + 1) * (S + 1) + x + 1] = I[y * (S + 1) + x + 1] + row; } }
  const R = 5, sum = (x0, y0, x1, y1) => I[y1 * (S + 1) + x1] - I[y0 * (S + 1) + x1] - I[y1 * (S + 1) + x0] + I[y0 * (S + 1) + x0];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) { const i = (y * S + x) * 4; if (!(d[i] < 70 && d[i + 1] < 70 && d[i + 2] < 70)) continue;
    const x0 = Math.max(0, x - R), y0 = Math.max(0, y - R), x1 = Math.min(S, x + R + 1), y1 = Math.min(S, y + R + 1);
    // solo si alrededor hay piel (no tocar bordes con otros colores: botas, peto…)
    if (sum(x0, y0, x1, y1) / ((x1 - x0) * (y1 - y0)) < 0.35) { const j = ((Math.min(S - 1, y + R)) * S + x) * 4, k = ((Math.max(0, y - R)) * S + x) * 4;
      const skin = (q) => Math.abs(d[q] - SKIN[0]) + Math.abs(d[q + 1] - SKIN[1]) + Math.abs(d[q + 2] - SKIN[2]) < 30;
      if (skin(j) || skin(k)) { d[i] = SKIN[0]; d[i + 1] = SKIN[1]; d[i + 2] = SKIN[2]; } } } }
// 2) cejas: arcos cortos y gruesos
const L = 226, R = 370, EY = 228;
// cejas separadas del ala del casco (si no, a 190 px se funden con ella); el ala, ladeada, tapa un poco la derecha
const brows = [...texels(band(arc(L - 30, L + 26, 184, 9), 19), L - 44, 160, L + 40, 198), ...texels(band(arc(R - 22, R + 26, 188, 7), 17), R - 36, 166, R + 40, 200)];
const open = new ImageData(new Uint8ClampedArray(base.data), S, S), shut = new ImageData(new Uint8ClampedArray(base.data), S, S);
for (const D of [open, shut]) paint(D, brows, DARK);
// 3a) ojos abiertos: óvalos de tinta con brillo en papel (blanco = se ve papel)
const eyes = [...texels(ell(L, EY, 20, 23), L - 22, EY - 27, L + 22, EY + 27), ...texels(ell(R, EY, 20, 23), R - 22, EY - 27, R + 22, EY + 27)];
paint(open, eyes, DARK);
const glints = [...texels(ell(L + 7, EY - 10, 8, 10), L - 2, EY - 21, L + 16, EY + 1), ...texels(ell(R + 7, EY - 10, 8, 10), R - 2, EY - 21, R + 16, EY + 1)];
paint(open, glints, WHITE);
// 3b) ojos cerrados: un arco de tinta (sonriente), a media altura del ojo
// ojos cerrados de risa: un arco hacia arriba, como en la mascota original
const lids = [...texels(band(arc(L - 22, L + 22, EY + 2, 16, 16), 12), L - 30, EY - 22, L + 30, EY + 12), ...texels(band(arc(R - 22, R + 22, EY + 2, 16, 16), 12), R - 30, EY - 22, R + 30, EY + 12)];
paint(shut, lids, DARK);
// 4) boca abierta (al hablar): una mancha de tinta bajo el centro del bigote, que al alternar con la cara normal
// hace que mueva la boca
const talk = new ImageData(new Uint8ClampedArray(open.data), S, S);
const MX = +(new URLSearchParams(location.search).get('mx') || 298), MY = +(new URLSearchParams(location.search).get('my') || 350);
const mouth = texels(ell(MX, MY + 4, 30, 23), MX - 34, MY - 22, MX + 34, MY + 30);
paint(talk, mouth, DARK);
const toURL = (D) => { g.putImageData(D, 0, 0); return cv.toDataURL('image/png'); };
window.OUT = { open: toURL(open), shut: toURL(shut), talk: toURL(talk), counts: { erase: erase.length, eyes: eyes.length, brows: brows.length, lids: lids.length } };
window.DONE = true;
</script></body></html>
