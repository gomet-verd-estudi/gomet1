<style>
  /* Archivo, Archivo Narrow, Fraunces: SIL Open Font License 1.1 (see fonts/OFL.txt), subset to Latin */
  @font-face { font-family: "Archivo"; src: url("fonts/archivo.woff2") format("woff2"); font-weight: 400 700; font-style: normal; font-display: swap; }
  @font-face { font-family: "Archivo Narrow"; src: url("fonts/archivo-narrow-500.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
  @font-face { font-family: "Fraunces"; src: url("fonts/fraunces-700.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }
  :root {
    --grey: #a6a6ab;
    --ink: #86868b;
    --line: #dddde0;
    --bg: #ececed;
    --hdr: 56px;
    --pad: clamp(20px, 5.5vw, 64px);
    --narrow: "Archivo Narrow", "Arial Narrow", "Roboto Condensed", sans-serif;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    font-family: "Archivo", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink); background: #fff; -webkit-font-smoothing: antialiased;
  }
  img { display: block; max-width: 100%; height: auto; }
  a { color: inherit; }
  button {
    font: inherit; color: var(--ink); background: transparent; cursor: pointer;
    border: 1.5px solid var(--grey); border-radius: 999px; height: 32px; padding: 0 12px;
    display: inline-flex; align-items: center; gap: 6px;
    letter-spacing: .08em; text-transform: uppercase; font-size: 11px; font-weight: 500;
    transition: background .15s, color .15s; -webkit-tap-highlight-color: transparent;
  }
  button:hover, button:focus-visible { background: var(--grey); color: #fff; outline: none; }
  button.icon { width: 32px; padding: 0; justify-content: center; }
  button svg { width: 14px; height: 14px; flex: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* GVE mark */
  .gve { display: inline-flex; flex: none; }
  .gve span {
    width: 24px; height: 24px; display: grid; place-items: center;
    border: 1.5px solid var(--grey); border-radius: 4px; margin-left: -1.5px;
    font-size: 12px; font-weight: 500; color: var(--grey); letter-spacing: 0; line-height: 1;
  }
  .gve span:first-child { margin-left: 0; }

  /* ---------- Header (both views) ---------- */
  .hdr {
    position: sticky; top: 0; z-index: 20; height: var(--hdr);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 0 max(var(--pad), env(safe-area-inset-right)) 0 max(var(--pad), env(safe-area-inset-left));
    background: rgba(255,255,255,.93); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; color: var(--ink); text-decoration: none; }
  .brand .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .brand .title b { font-weight: 700; }
  .tools { display: flex; align-items: center; gap: 8px; flex: none; }
  .count { font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }
  .count .sec { margin-left: 10px; color: var(--grey); }
  .hdr .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 1.5px; background: var(--line); }
  .prog i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--grey); transition: width .2s ease; }
  .is-deck .hdr { position: relative; background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .is-deck .hdr .prog, .is-deck .count .sec { display: none; }
  .is-read #fsBtn { display: none; }
  .modeBtn .to-read, .is-read .modeBtn .to-deck { display: inline-flex; align-items: center; gap: 6px; }
  .modeBtn .to-deck, .is-read .modeBtn .to-read { display: none; }
  .brand .title .short { display: none; }
  .crumb .vs svg { display: none; }
  @media (max-width: 760px) {
    .brand .title .long, .brand .title b, .count .sec { display: none; }
    .brand .title .short { display: inline; font-weight: 700; }
    .tools button .lbl { display: none; }
    .tools button:not(.icon) { width: 32px; padding: 0; justify-content: center; }
  }
  @media (max-width: 300px) { .brand .title { display: none; } }
  @media (max-width: 560px) {
    .crumb .vs { width: 28px; padding: 0; justify-content: center; }
    .crumb .vs span { display: none; } .crumb .vs svg { display: block; width: 13px; height: 13px; }
  }

  /* ---------- Deck view (wide screens) ---------- */
  .deck { display: none; }
  .is-deck, .is-deck body { height: 100%; overflow: hidden; }
  .is-deck body { background: var(--bg); display: grid; grid-template-rows: auto 1fr; height: 100vh; height: 100dvh; }
  .is-deck .deck { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
  .is-deck .read { display: none; }
  .stage { position: relative; display: grid; place-items: center; padding: 4px 22px; min-height: 0; }
  .frame {
    position: relative; aspect-ratio: 16 / 9;
    width: min(100%, calc((100vh - 136px) * 16 / 9)); width: min(100%, calc((100dvh - 136px) * 16 / 9));
    background: #fff; box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 18px 50px -24px rgba(0,0,0,.28);
    overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: opacity .18s ease; }
  .frame img.hidden { opacity: 0; }
  .hit { position: absolute; top: 0; bottom: 0; width: 50%; background: transparent; border: 0; border-radius: 0; height: auto; padding: 0; }
  .hit:hover, .hit:focus-visible { background: transparent; }
  .hit.prev { left: 0; cursor: w-resize; } .hit.next { right: 0; cursor: e-resize; }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; background: rgba(255,255,255,.88); }
  .nav.prev { left: 8px; } .nav.next { right: 8px; }
  .stage:not(:hover) .nav { opacity: 0; }
  @media (hover: none) { .nav { display: none; } }
  .dfoot { padding: 10px 22px 16px; display: flex; align-items: center; gap: 16px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .dfoot .prog { position: relative; flex: 1; height: 1.5px; background: var(--line); }
  .dfoot .section { white-space: nowrap; font-weight: 500; }
  .dfoot .hint { white-space: nowrap; opacity: .85; }
  @media (max-width: 760px) { .dfoot .hint { display: none; } .stage { padding: 4px 10px; } }
  :fullscreen .hdr, :fullscreen .dfoot { opacity: 0; transition: opacity .2s; }
  :fullscreen body:hover .hdr, :fullscreen body:hover .dfoot { opacity: 1; }

  /* ---------- Read view (reflowed, any screen) ---------- */
  .sl {
    position: relative; scroll-margin-top: var(--hdr);
    padding: clamp(52px, 9vw, 112px) max(var(--pad), calc((100% - 1320px) / 2));
    border-top: 1px solid var(--line);
  }
  .crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--grey); font-weight: 500; }
  .crumb .n { width: 28px; height: 28px; border: 1px solid currentColor; border-radius: 50%; display: grid; place-items: center; letter-spacing: 0; }
  .crumb .b { border: 1px solid currentColor; padding: 7px 10px; line-height: 1; }
  .crumb .p { border: 1px solid currentColor; border-radius: 999px; padding: 7px 11px; line-height: 1; }
  .crumb .vs { margin-left: auto; height: 28px; font-size: 10px; padding: 0 10px; border-width: 1px; color: var(--grey); }
  .crumb .vs:hover, .crumb .vs:focus-visible { color: #fff; }
  .ttl {
    font-family: var(--narrow); font-weight: 500; color: var(--grey);
    font-size: clamp(50px, 14vw, 148px); line-height: .92; letter-spacing: -.025em;
    margin: .16em 0 .3em -.05em;
  }
  .hd { font-family: var(--serif); font-weight: 700; color: var(--grey); font-size: clamp(25px, 6.2vw, 42px); line-height: 1.12; letter-spacing: -.012em; max-width: 21em; }
  .tx { font-size: clamp(16.5px, 4.3vw, 20px); line-height: 1.5; margin-top: .75em; max-width: 36em; }
  .ld { font-family: var(--narrow); font-weight: 500; color: var(--grey); font-size: clamp(40px, 11vw, 100px); line-height: .98; letter-spacing: -.02em; max-width: 11em; }
  .ld + .tx { margin-top: 1em; }
  .ld2 { font-family: var(--narrow); font-weight: 500; color: var(--grey); font-size: clamp(23px, 5.8vw, 32px); line-height: 1.15; margin-top: .3em; max-width: 24em; }
  .kk { margin-top: 48px; font-size: 11px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--grey); }
  .ttl + .kk { margin-top: 8px; }
  .rl { border: 0; border-top: 1px solid var(--grey); margin-top: 32px; }
  .cp { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; margin-top: 14px; line-height: 1.5; }
  .nt { font-size: 14.5px; line-height: 1.5; margin-top: 32px; max-width: 40em; }
  .qt { font-family: var(--serif); font-weight: 700; color: var(--grey); font-size: clamp(22px, 5.4vw, 34px); line-height: 1.2; margin-top: 44px; max-width: 24em; }

  .its { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); column-gap: clamp(20px, 3vw, 40px); margin-top: 32px; }
  .it { border-top: 1px solid var(--grey); padding: 12px 0 20px; }
  .it b, .lbl-s { display: block; font-size: 11px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--grey); margin-bottom: 6px; }
  .it p { font-size: 16px; line-height: 1.45; }

  .mt { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 24px; margin-top: 40px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--grey); line-height: 1.5; }

  .fig { position: relative; margin-top: 32px; }
  .fig > img { width: 100%; cursor: zoom-in; }
  .zm { position: absolute; right: 0; bottom: 0; width: 30px; height: 30px; padding: 0; justify-content: center; border-width: 1px; background: rgba(255,255,255,.9); }
  @media (hover: hover) { .fig:not(:hover) .zm { opacity: 0; } }

  /* split slides: text left, drawing right on wide screens; text → drawing → details on narrow */
  .sl.split { display: flex; flex-direction: column; }
  .sl.split .txt { display: contents; }
  .sl.split .pre { order: 1; } .sl.split .vis { order: 2; } .sl.split .post { order: 3; }
  @media (min-width: 1000px) {
    .sl.split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); column-gap: clamp(40px, 5vw, 88px); align-items: center; }
    .sl.split .txt { display: block; }
    .sl.split .vis .fig { margin-top: 0; }
    .sl.split .its { grid-template-columns: 1fr; }
  }

  /* tables → stacked cards on phones */
  .tbl { width: 100%; border-collapse: collapse; margin-top: 28px; font-size: 15.5px; line-height: 1.4; }
  .tbl th { text-align: left; font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--grey); padding: 0 16px 10px 0; border-bottom: 1px solid var(--grey); vertical-align: bottom; }
  .tbl td { padding: 13px 16px 13px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tbl td:first-child { color: var(--grey); font-family: var(--narrow); font-weight: 500; font-size: 20px; line-height: 1.2; }
  @media (max-width: 699px) {
    .tbl thead { display: none; }
    .tbl, .tbl tbody, .tbl tr, .tbl td { display: block; width: 100%; }
    .tbl tr { border-top: 1px solid var(--grey); padding: 12px 0 16px; }
    .tbl td { border: 0; padding: 0; }
    .tbl td:first-child { font-size: 23px; }
    .tbl td + td::before { content: attr(data-l); display: block; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--grey); margin: 10px 0 2px; }
  }

  .st { list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); column-gap: 24px; margin-top: 28px; }
  .st li { border-top: 1px solid var(--grey); padding: 10px 0 18px; display: grid; grid-template-columns: 2.6em 1fr; }
  .st i { font-style: normal; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; color: var(--grey); padding-top: 7px; grid-row: span 2; }
  .st b { font-family: var(--narrow); font-weight: 500; font-size: 23px; line-height: 1.15; color: var(--grey); }
  .st p { font-size: 15px; line-height: 1.4; margin-top: 2px; }

  .qa { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); column-gap: clamp(24px, 3vw, 44px); margin-top: 36px; }
  .qa > div { border-top: 1px solid var(--grey); padding: 14px 0 26px; }
  .qa b { display: block; font-family: var(--narrow); font-weight: 500; font-size: clamp(22px, 5.4vw, 29px); line-height: 1.15; color: var(--grey); margin-bottom: 8px; }
  .qa p { font-size: 16px; line-height: 1.45; }

  .pl { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 148px), 1fr)); gap: 32px clamp(16px, 2.5vw, 40px); margin-top: 36px; }
  .pl .pi { height: clamp(104px, 20vw, 168px); display: flex; align-items: center; margin: 12px 0 14px; }
  .pl .pi img { max-height: 100%; width: auto; max-width: 100%; }
  .pl p { font-size: 14.5px; line-height: 1.45; }

  .lg { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 28px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--grey); }
  .lg span { display: inline-flex; align-items: center; gap: 8px; }
  .m { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: middle; position: relative; z-index: 1; flex: none; }
  .m.f { background: #9d9da2; }
  .m.o { border: 1.2px solid var(--grey); background: #fff; }
  .m.c { width: 17px; height: 17px; color: var(--grey); }
  .m.c svg, .so svg { width: 100%; height: 100%; display: block; }

  .only-narrow { display: block; }
  .only-wide { display: none; }
  @media (min-width: 1000px) { .only-narrow { display: none; } .only-wide { display: block; } }

  /* Who takes part: phases as rows */
  .mx { width: 100%; border-collapse: collapse; margin-top: 22px; table-layout: fixed; }
  .mx thead th { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--grey); vertical-align: bottom; padding: 0 2px 10px; text-align: center; }
  .mx thead th:first-child { width: 36%; }
  .mx thead th.you { color: var(--ink); }
  .mx thead th span { writing-mode: vertical-rl; transform: rotate(180deg); display: inline-block; white-space: nowrap; text-align: left; }
  .mx tbody th { text-align: left; font-weight: 500; font-size: 15px; color: var(--ink); padding: 13px 6px 13px 0; border-top: 1px solid var(--line); }
  .mx tbody th i { font-style: normal; font-size: 10.5px; font-weight: 700; color: var(--grey); margin-right: 8px; letter-spacing: .06em; }
  .mx td { text-align: center; border-top: 1px solid var(--line); position: relative; }
  .mx td.ln::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--grey); }
  .mx tr:first-child td.ln::before { top: 50%; }
  .mx tr:last-child td.ln::before { bottom: 50%; }
  @media (min-width: 560px) { .mx thead th span { writing-mode: horizontal-tb; transform: none; white-space: normal; text-align: center; } }

  /* Truss: technical and creative, crossing at every phase */
  .tr { margin-top: 26px; }
  .tr-h, .tr-r { display: grid; grid-template-columns: 1fr 44px 1fr; column-gap: 14px; }
  .tr-h span { font-size: 10.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--grey); padding-bottom: 10px; }
  .tr-h span:first-child, .tr-t { text-align: right; }
  .tr-r { align-items: center; }
  .tr-t, .tr-c { padding: 15px 0; font-size: 15px; line-height: 1.35; }
  .tr-t i { display: block; font-style: normal; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; color: var(--grey); margin-bottom: 3px; }
  .tr-m { position: relative; align-self: stretch; }
  .tr-m svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .tr-m path { fill: none; stroke: var(--grey); stroke-width: 1; }
  .so { position: absolute; width: 18px; height: 18px; color: var(--grey); z-index: 2; }
  .tr-m .so { bottom: 0; transform: translate(-50%, 50%); }
  .tr-m .so.l { left: 4px; } .tr-m .so.r { left: 40px; }

  /* Timeline: phases and sign-offs, vertical */
  .tl { list-style: none; position: relative; margin-top: 26px; }
  .tl::before { content: ""; position: absolute; left: 11px; top: 30px; bottom: 34px; width: 1px; background: var(--grey); }
  .tl li { position: relative; padding-left: 40px; }
  .tl .act { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--grey); padding: 26px 0 6px 40px; }
  .tl .act:first-child { padding-top: 0; }
  .tl .act::after { content: ""; display: block; height: 7px; border: 1px solid var(--line); border-bottom: 0; margin-top: 8px; }
  .tl .ph { display: grid; grid-template-columns: clamp(96px, 30vw, 150px) 1fr; align-items: center; gap: 16px; padding-top: 8px; padding-bottom: 8px; }
  .tl .ph::before { content: ""; position: absolute; left: 5px; top: 50%; width: 13px; height: 1px; background: var(--grey); }
  .tl .ph img { width: 100%; height: clamp(64px, 20vw, 96px); object-fit: contain; object-position: left center; }
  .tl .ph b { display: block; font-family: var(--narrow); font-weight: 500; font-size: 23px; line-height: 1.15; color: var(--grey); }
  .tl .ph span { font-size: 14.5px; }
  .tl .ph i { font-style: normal; font-size: 12px; font-weight: 700; letter-spacing: .06em; margin-right: 6px; }
  .tl .so-r { height: 34px; display: flex; align-items: center; font-size: 10px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--grey); }
  .tl .so-r .so { left: 2px; top: 50%; width: 19px; height: 19px; transform: translateY(-50%); }

  /* Positioning map */
  .map { position: relative; aspect-ratio: 1140 / 702; margin-top: 30px; max-width: 980px; }
  .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map .ax { stroke: var(--grey); stroke-width: 1; fill: none; }
  .map .op { fill: #e6e6e8; }
  .map .d { position: absolute; width: 11px; height: 11px; border-radius: 50%; transform: translate(-50%, -50%); background: #9d9da2; }
  .map .d.b { background: #f3f3f4; border: 1.2px solid var(--grey); }
  .map .pill { position: absolute; transform: translate(-50%, -50%); background: var(--grey); color: #fff; border-radius: 999px; padding: 5px 10px; font-size: clamp(8.5px, 1.6vw, 12px); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; line-height: 1; }
  .map .pill.w { left: 0 !important; transform: translate(0, -50%); }
  .map .pill.e { left: auto !important; right: 0; transform: translate(0, -50%); }
  .map .open { position: absolute; right: 1.2%; bottom: 3%; font-size: clamp(8.5px, 1.5vw, 12px); letter-spacing: .1em; text-transform: uppercase; color: var(--grey); white-space: nowrap; }
  .map + .lg { margin-top: 16px; }

  /* Target rings */
  .rings { position: relative; aspect-ratio: 682 / 300; max-width: 680px; margin-top: 30px; }
  .rings svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .rings ellipse { fill: none; stroke: var(--grey); stroke-width: 1; }
  .rings .o { stroke-dasharray: 4 4; }
  .rings .i { fill: #e3e3e5; }
  .rings span { position: absolute; left: 50%; transform: translate(-50%, -50%); font-size: clamp(10px, 2.2vw, 14px); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--grey); }

  /* Contact */
  .ct { margin-top: 8px; border-top: 1px solid var(--grey); padding-top: 12px; }
  .ct a { display: block; font-size: 16px; line-height: 1.6; text-decoration: none; }
  .ct a:hover { text-decoration: underline; }

  /* Cover + closing */

  }

  /* deck */
  var slideImg = $("slide"), cache = {};
  var srcOf = function (n) { return "slides/s" + pad(n) + ".webp"; };
  function preload(n) { if (n < 1 || n > N || cache[n]) return; var im = new Image(); im.src = srcOf(n); cache[n] = im; }
  function show(n) {
    cur = Math.min(N, Math.max(1, n));
    slideImg.classList.add("hidden");
    var target = srcOf(cur), im = new Image();
    im.onload = im.onerror = function () { if (slideImg.getAttribute("data-src") === target) { slideImg.src = target; slideImg.classList.remove("hidden"); } };
    slideImg.setAttribute("data-src", target); slideImg.alt = "Slide " + cur + ": " + nameOf(cur);
    im.src = target;
    preload(cur + 1); preload(cur - 1);
    setHash(cur); paint();
  }
  function go(n) { if (mode === "deck") show(n); else scrollToSlide(n); }

  /* read */
  function scrollToSlide(n, smooth) {
    cur = Math.min(N, Math.max(1, n));
    var el = $("slide-" + cur); if (!el) return;
    lockUntil = Date.now() + 700;
    var y = cur === 1 ? 0 : el.getBoundingClientRect().top + window.pageYOffset - $("hdr").offsetHeight + 1;
    window.scrollTo({ top: Math.max(0, y), behavior: smooth ? "smooth" : "auto" });
    setHash(cur); paint();
  }
  var io = new IntersectionObserver(function (es) {
    if (mode !== "read" || Date.now() < lockUntil) return;
    es.forEach(function (e) { if (e.isIntersecting) { var n = +e.target.getAttribute("data-n"); if (n !== cur) { cur = n; setHash(cur); paint(); } } });
  }, { rootMargin: "-40% 0px -59% 0px" });
  Array.prototype.forEach.call(document.querySelectorAll("#read [data-n]"), function (el) { io.observe(el); });

  function setMode(m) {
    if (m === mode) return;
    mode = m;
    root.classList.toggle("is-deck", m === "deck");
    root.classList.toggle("is-read", m === "read");
    if (m === "deck") show(cur);
    else { var target = cur; lockUntil = Date.now() + 1000; requestAnimationFrame(function () { scrollToSlide(target); }); }
  }

  /* ---------- index overlay ---------- */
  var groups = $("groups"), html = "";
  SECTIONS.forEach(function (s) {
    html += '<div class="group"><h3>' + esc(s[0]) + ' <span>' + pad(s[1]) + (s[2] > s[1] ? "–" + pad(s[2]) : "") + '</span></h3><div class="thumbs">';
    for (var n = s[1]; n <= s[2]; n++) html += '<button class="thumb" data-n="' + n + '" aria-label="Go to slide ' + n + ': ' + esc(nameOf(n)) + '"><img loading="lazy" src="slides/t' + pad(n) + '.webp" alt=""><em>' + pad(n) + ' · ' + esc(nameOf(n)) + '</em></button>';
    html += '</div></div>';
  });
  groups.innerHTML = html;
  var ov = $("overview");
  function lock() { root.classList.toggle("is-locked", ov.classList.contains("open") || $("lb").classList.contains("open")); }
  function openOv() { ov.classList.add("open"); lock(); paint(); var c = ov.querySelector(".thumb.current"); if (c) c.scrollIntoView({ block: "center" }); }
  function closeOv() { ov.classList.remove("open"); lock(); }
  $("gridBtn").onclick = function () { ov.classList.contains("open") ? closeOv() : openOv(); };
  $("closeBtn").onclick = closeOv;
  groups.addEventListener("click", function (e) { var t = e.target.closest(".thumb"); if (t) { closeOv(); go(+t.getAttribute("data-n")); } });

  /* ---------- lightbox ---------- */
  var lb = $("lb"), lbImg = $("lbImg"), lbSc = $("lbSc");
  function openLb(src, w, h, cap, alignLeft) {
    lbImg.removeAttribute("src");
    lbImg.style.setProperty("--h", h + "px");
    lbImg.onload = function () { lbSc.scrollLeft = alignLeft ? 0 : (lbSc.scrollWidth - lbSc.clientWidth) / 2; };
    lbImg.src = src; lbImg.alt = cap; $("lbCap").textContent = cap;
    lb.classList.add("open"); lock(); $("lbClose").focus({ preventScroll: true });
  }
  function closeLb() { lb.classList.remove("open"); lbImg.removeAttribute("src"); lock(); }
  $("lbClose").onclick = closeLb;
  $("read").addEventListener("click", function (e) {
    var b = e.target.closest("[data-slide]");
    if (b) { var n = +b.getAttribute("data-slide"); openLb(srcOf(n), 1920, 1080, "Slide " + pad(n) + " · " + nameOf(n), true); return; }
    var z = e.target.closest("[data-zoom]") || (e.target.closest("[data-zoombtn]") && e.target.closest(".fig").querySelector("[data-zoom]"));
    if (z) openLb(z.getAttribute("data-zoom"), +z.getAttribute("data-w"), +z.getAttribute("data-h"), z.alt, false);
  });

  /* ---------- controls ---------- */
  $("modeBtn").onclick = function () {
    var next = mode === "deck" ? "read" : "deck";
    forced = next === "deck" ? "slides" : "read";
    try { history.replaceState(null, "", location.pathname + "?view=" + forced + "#slide-" + cur); } catch (e) {}
    setMode(next);
  };
  $("prevBtn").onclick = $("hitPrev").onclick = function () { show(cur - 1); };
  $("nextBtn").onclick = $("hitNext").onclick = function () { show(cur + 1); };
  function toggleFs() {
    var d = document, el = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else if (el.requestFullscreen) el.requestFullscreen(); else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }
  $("fsBtn").onclick = toggleFs;
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === "Escape") { if (lb.classList.contains("open")) closeLb(); else closeOv(); return; }
    if (lb.classList.contains("open")) return;
    if (k === "g" || k === "G") { ov.classList.contains("open") ? closeOv() : openOv(); return; }
    if (k === "v" || k === "V") { $("modeBtn").click(); return; }
    if (mode !== "deck" || ov.classList.contains("open")) return;
    if (k === "ArrowRight" || k === "PageDown" || k === " ") { e.preventDefault(); show(cur + 1); }
    else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); show(cur - 1); }
    else if (k === "Home") show(1);
    else if (k === "End") show(N);
    else if (k === "f" || k === "F") toggleFs();
  });
  var sx = null, sy = null;
  $("stage").addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  $("stage").addEventListener("touchend", function (e) {
    if (sx === null) return; var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; sx = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) show(cur + (dx < 0 ? 1 : -1));
  }, { passive: true });
  window.addEventListener("hashchange", function () { var n = fromHash(); if (n !== cur || mode === "read") go(n); });
  var onMq = function () { if (!forced) setMode(autoMode()); };
  if (mq.addEventListener) mq.addEventListener("change", onMq); else mq.addListener(onMq);

  /* ---------- start ---------- */
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  cur = fromHash();
  setMode(forced === "slides" ? "deck" : forced === "read" ? "read" : autoMode());
  var userMoved = false, moved = function () { userMoved = true; };
  ["wheel", "touchstart", "keydown", "mousedown"].forEach(function (ev) { window.addEventListener(ev, moved, { passive: true, once: true }); });
  var start = cur;
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (mode === "read" && start > 1 && !userMoved) scrollToSlide(start); });
})();
</script>
</body>
</html>
