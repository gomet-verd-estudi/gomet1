  :root {

  /* ---------- chrome (manelvila: small, fixed, in the corners) ---------- */
  .prog { position: fixed; top: 0; left: 0; height: 2px; width: 0; background: var(--g); z-index: 31; transition: width .25s linear; }
  .top { position: fixed; top: 0; left: 0; right: 0; height: var(--hd); z-index: 30; display: flex; align-items: center; justify-content: space-between;
    padding: 0 max(var(--pad), env(safe-area-inset-right)) 0 max(var(--pad), env(safe-area-inset-left)); pointer-events: none; }

  .gve { display: inline-flex; text-decoration: none; }
  .gve span { width: 26px; height: 26px; display: grid; place-items: center; border: 1.5px solid var(--g1); border-radius: 4px; margin-left: -1.5px; font-size: 13px; font-weight: 700; color: var(--g1); line-height: 1; background: var(--paper); }
  .gve span:first-child { margin-left: 0; }
  .pill { display: inline-flex; align-items: center; gap: 9px; height: 34px; padding: 0 14px; border-radius: 999px; background: rgba(244, 239, 230, .86); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    font-size: 14.5px; letter-spacing: .02em; color: var(--g3); font-variant-numeric: tabular-nums; box-shadow: 0 0 0 1px var(--line) inset; }
  .pill svg { width: 13px; height: 13px; }
  .pill:hover, .pill:focus-visible { box-shadow: 0 0 0 1.5px var(--g2) inset; outline: none; }
  .corner { position: fixed; bottom: 9px; z-index: 30; color: var(--g2); text-decoration: none; background: var(--paper); padding: 4px 7px; border-radius: 4px; }

  .corner.l { left: max(var(--pad), env(safe-area-inset-left)); }

  @media (max-width: 899px) { .corner { display: none; } .top { background: linear-gradient(var(--paper) 62%, rgba(244, 239, 230, 0)); } }

  /* ---------- plates ---------- */
  .pl { position: relative; padding: calc(var(--hd) + 3vh) var(--pad) clamp(72px, 11vh, 132px); border-top: 1px solid var(--line); scroll-margin-top: 0; }
  .pl-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 26px; color: var(--g2); }
  .pl-meta .vs { margin-left: auto; color: var(--g2); display: inline-flex; align-items: center; gap: 7px; }
  .pl-meta .vs:hover { color: var(--g); }
  .pl-meta .vs svg { width: 13px; height: 13px; }
  .pl-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-top: 12px; }
  .ttl { font-weight: 900; font-stretch: 62%; color: var(--g1); font-size: min(clamp(66px, 11.4vw, 206px), calc((100vw - 2 * var(--pad)) / (var(--ch, 10) * .44))); line-height: .82; letter-spacing: -.012em; margin-left: -.035em; }
  .num { flex: none; font-weight: 400; font-stretch: 62%; color: var(--g1); font-size: clamp(46px, 6.4vw, 116px); line-height: .82; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .num small { font-size: .3em; letter-spacing: .02em; vertical-align: top; margin-left: .15em; }
  .two { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); column-gap: var(--pad); }
  .pl-body { margin-top: clamp(26px, 4.5vh, 56px); grid-template-areas: "hl dr" "lg dr" "xx dr"; grid-template-rows: auto auto 1fr; align-items: start; }
  .hl { grid-area: hl; font-size: clamp(25px, 2.35vw, 44px); line-height: 1.02; font-weight: 500; color: var(--g3); letter-spacing: -.02em; max-width: 13.5em; text-wrap: balance; }
  .hl.big { font-weight: 900; font-stretch: 62%; color: var(--g1); font-size: clamp(42px, 6vw, 112px); line-height: .86; letter-spacing: -.01em; max-width: 9em; }
  .dr { grid-area: dr; min-width: 0; }
  .legend { grid-area: lg; list-style: none; margin-top: 1.15em; }
  .legend li { display: flex; align-items: center; gap: .5em; padding: .06em 0; cursor: default; color: var(--g3); }
  .legend .n { flex: none; width: 21px; height: 21px; display: inline-grid; place-items: center; border: 1.5px solid var(--g); border-radius: 50%; color: var(--g); font-size: 11px; font-weight: 700; align-self: center; transition: background .2s, color .2s; }
  .legend li.hi .n { background: var(--g); color: var(--paper); }
  .legend .rp { margin-top: .9em; color: var(--g2); display: inline-flex; align-items: center; gap: 7px; }
  .legend .rp:hover { color: var(--g); }

  .draw { position: relative; width: 100%; height: min(64vh, 46vw); }

  .lead p + p, .kv-v p + p { margin-top: 1.15em; }
  .xx { grid-area: xx; margin-top: 1.6em; max-width: 26em; }
  .kv { margin-top: clamp(30px, 6vh, 76px); }
  .kv-row { padding: .58em 0; }
  .kv-k { color: var(--g1); }
  .kv-k i, .kv-v .lbl i { font-style: normal; color: var(--g1); margin-right: .2em; }
  .kv-v .kl { color: var(--g3); font-weight: 500; letter-spacing: -.012em; }
  .kv-v .sb { margin-top: .7em; }
  .kv-v .kl + p:not(.sb) { margin-top: .4em; }
  .kv-v .kl + .sb, .kv-v .sb:first-child { margin-top: .55em; }
  .kv-v .lbl { display: block; color: var(--g1); }
  .kv-v .note, .kv-v .note + p { color: var(--g2); }
  .kv-v .quote + *, .kv-v * + .quote { margin-top: .6em; }
  .kv-v .sub { display: block; margin-top: .55em; color: var(--g2); }
  .kv-v .sub:first-child { margin-top: 0; }
  .kv-v .quote { font-weight: 900; font-stretch: 62%; color: var(--g1); font-size: 1.9em; line-height: .9; letter-spacing: -.01em; text-wrap: balance; }
  .kv-v .gm, .pl-foot .gm { display: inline-block; width: .62em; height: .62em; border-radius: 50%; background: var(--g); margin-right: .45em; vertical-align: .02em; }
  .kv-v a { text-decoration: none; } .kv-v a:hover { color: var(--g); }
  .pl-foot { margin-top: clamp(28px, 5vh, 64px); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 24px; color: var(--g2); }
  .pl-foot .gm { width: 9px; height: 9px; margin-right: 7px; vertical-align: 0; }

  /* the four pillars */
  .pil { margin-top: clamp(30px, 6vh, 70px); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px var(--pad); }
  .pil .draw { height: auto; aspect-ratio: 1 / .8; margin: 12px 0 14px; }
  .pil h3 { color: var(--g2); }

  /* cover and closing */
  .cover { min-height: 100vh; min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; padding-bottom: clamp(40px, 7vh, 80px); border-top: 0; }
  .cover .logo { align-self: center; justify-self: center; width: min(78vw, 980px); margin: 6vh 0; }
  .cover .ttl { font-size: clamp(80px, 15vw, 300px); }
  .cover .bot { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
  .cover .bot p { max-width: 15em; }
  .cue { display: inline-flex; align-items: center; gap: 8px; color: var(--g2); text-decoration: none; }
  .closing .giant { margin-top: clamp(48px, 10vh, 120px); font-weight: 900; font-stretch: 62%; color: var(--g1); font-size: 14.2vw; line-height: .8; letter-spacing: -.02em; white-space: nowrap; margin-left: -.04em; }

  /* ---------- diagrams rebuilt in HTML, in the same green line ---------- */
  .rings { position: relative; aspect-ratio: 682 / 300; max-width: 760px; margin-top: 4vh; }
  .rings svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .rings ellipse { fill: none; stroke: var(--g); stroke-width: 1.4; }

  .rings .i { fill: var(--blank); stroke-width: 2.4; }
  .rings span { position: absolute; left: 50%; transform: translate(-50%, -50%); color: var(--g); }
  .map { position: relative; aspect-ratio: 1140 / 702; max-width: 900px; margin-top: 2vh; }
  .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map .ax { stroke: var(--g); stroke-width: 1.2; fill: none; }
  .map .op { fill: var(--blank); stroke: var(--g); stroke-width: 1.2; stroke-dasharray: 5 5; }
  .map .d { position: absolute; width: 11px; height: 11px; border-radius: 50%; transform: translate(-50%, -50%); background: var(--g); }
  .map .d.b { background: var(--paper); border: 1.5px solid var(--g); }
  .map .pill2 { position: absolute; transform: translate(-50%, -50%); background: var(--paper); color: var(--g); border: 1.5px solid var(--g); border-radius: 999px; padding: 5px 10px; white-space: nowrap; font-size: clamp(9px, 1.3vw, 11px); }
  .map .pill2.w { left: 0 !important; transform: translate(0, -50%); }
  .map .pill2.e { left: auto !important; right: 0; transform: translate(0, -50%); }
  .map .pill2.you { background: var(--g); color: var(--paper); }
  .map .open { position: absolute; right: 2%; bottom: 7.5%; color: var(--g); }
  .mlg { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 16px; color: var(--g2); }
  .mlg span { display: inline-flex; align-items: center; gap: 8px; }
  .m { display: inline-block; width: 13px; height: 13px; border-radius: 50%; vertical-align: middle; flex: none; position: relative; z-index: 1; }
  .m.f { background: var(--g); }
  .m.o { border: 1.5px solid var(--g); background: var(--paper); }
  .m.c { width: 17px; height: 17px; }
  .m.c svg, .so svg { width: 100%; height: 100%; display: block; }
  .tl { list-style: none; position: relative; margin-top: 2vh; }
  .tl::before { content: ""; position: absolute; left: 11px; top: 30px; bottom: 30px; width: 1.5px; background: var(--g); }
  .tl li { position: relative; padding-left: 40px; }
  .tl .act { color: var(--g2); padding: 22px 0 4px 40px; }
  .tl .act:first-child { padding-top: 0; }
  .tl .ph { display: grid; grid-template-columns: clamp(92px, 9vw, 150px) 1fr; align-items: center; gap: 14px; padding: 4px 0; }
  .tl .ph::before { content: ""; position: absolute; left: 5px; top: 50%; width: 13px; height: 1.5px; background: var(--g); }
  .tl .ico { display: block; position: relative; height: clamp(70px, 7vw, 110px); }
  .tl .ph b { font-weight: 500; color: var(--g3); }
  .tl .ph i { font-style: normal; color: var(--g1); margin-right: .35em; }
  .tl .ph span { display: block; color: var(--g1); }
  .tl .so-r { height: 32px; display: flex; align-items: center; color: var(--g2); }
  .so { position: absolute; width: 21px; height: 21px; left: 1px; top: 50%; transform: translateY(-50%); }

  .tr-h, .tr-r { display: grid; grid-template-columns: 1fr 44px 1fr; column-gap: 16px; }
  .tr-h span { color: var(--g2); padding-bottom: 10px; }
  .tr-h span:first-child, .tr-t { text-align: right; }
  .tr-r { align-items: center; }
  .tr-t, .tr-c { padding: 12px 0; }
  .tr-t i { display: block; font-style: normal; color: var(--g1); }
  .tr-m { position: relative; align-self: stretch; }
  .tr-m svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .tr-m path { fill: none; stroke: var(--g); stroke-width: 1.4; }
  .tr-m .so { top: auto; bottom: 0; transform: translate(-50%, 50%); }
  .tr-m .so.l { left: 4px; } .tr-m .so.r { left: 40px; }
  .mx { width: 100%; border-collapse: collapse; margin-top: 2vh; table-layout: fixed; }
  .mx thead th { color: var(--g2); vertical-align: bottom; padding: 0 2px 10px; text-align: center; font-weight: 700; }
  .mx thead th:first-child { width: 34%; }
  .mx thead th.you { color: var(--g); }
  .mx tbody th { text-align: left; font-weight: 400; color: var(--g3); padding: 9px 6px 9px 0; border-top: 1px solid var(--line); }
  .mx tbody th i { font-style: normal; color: var(--g1); margin-right: .4em; }
  .mx td { text-align: center; border-top: 1px solid var(--line); position: relative; }
  .mx td.ln::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1.5px; margin-left: -.75px; background: var(--g); }
  .mx tr:first-child td.ln::before { top: 50%; }
  .mx tr:last-child td.ln::before { bottom: 50%; }
  @media (max-width: 599px) { .mx thead th span { writing-mode: vertical-rl; transform: rotate(180deg); display: inline-block; white-space: nowrap; text-align: left; } }
  .gv-s circle { fill: var(--g); } .gv-s path { fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  /* reveal for the HTML diagrams */
  .rv .rv-i { opacity: 0; transform: translateY(14px); transition: opacity .6s ease, transform .7s cubic-bezier(.2, .8, .2, 1); transition-delay: calc(var(--i, 0) * 110ms); }
  .rv .rv-o { opacity: 0; transition: opacity .6s ease; transition-delay: calc(var(--i, 0) * 110ms); }
  .rv.in .rv-i { opacity: 1; transform: none; }
  .rv.in .rv-o { opacity: 1; }
  .map.rv .d.rv-i { transform: translate(-50%, -50%) scale(0); transition-timing-function: ease, cubic-bezier(.3, 1.6, .5, 1); }
  .map.rv.in .d.rv-i { transform: translate(-50%, -50%) scale(1); }
  .map.rv .op { opacity: 0; transition: opacity 1s ease 1.8s; }
  .map.rv.in .op { opacity: 1; }
  .map.rv .ax { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.2s cubic-bezier(.6, 0, .2, 1); }

  .rings.rv.in ellipse { transform: none; opacity: 1; }

  /* ---------- index (manelvila grid) ---------- */
  .ix { position: fixed; inset: 0; z-index: 40; background: var(--paper); overflow: auto; display: none; padding: var(--hd) var(--pad) 48px; }
  .ix.open { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); column-gap: var(--pad); align-items: start; }

  .ix-g { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 10px; padding-top: 8px; }

  .tile.cur { outline: 2px solid var(--g); outline-offset: 2px; }
  .ix-x { position: fixed; top: 11px; right: var(--pad); z-index: 41; }
  @media (max-width: 899px) { .ix.open { display: block; } .ix-l { position: static; margin-bottom: 24px; } }

  /* lightbox for the original slide */
  .lb { position: fixed; inset: 0; z-index: 50; background: rgba(244, 239, 230, .97); display: none; }
  .lb.open { display: block; }
  .lb .bar { position: absolute; top: 0; left: 0; right: 0; height: var(--hd); display: flex; align-items: center; justify-content: space-between; padding: 0 var(--pad); color: var(--g2); }
  .lb .sc2 { position: absolute; top: var(--hd); left: 0; right: 0; bottom: 0; overflow: auto; display: flex; padding: 0 12px 12px; }
  .lb img { margin: auto; flex: none; max-width: none; width: auto; height: min(1080px, calc(100vh - var(--hd) - 12px)); height: min(1080px, calc(100dvh - var(--hd) - 12px)); box-shadow: 0 18px 50px -24px rgba(0, 0, 0, .3); }
  .is-locked, .is-locked body { overflow: hidden; }

  /* ---------- phones and tablets ---------- */
  @media (max-width: 899px) {
    :root { --fs: 18.5px; --hd: 52px; }
    .pl { padding-top: calc(var(--hd) + 18px); }

    .pl-body { grid-template-areas: "hl" "dr" "lg" "xx"; grid-template-rows: auto; }

    .draw { height: auto; aspect-ratio: 1 / .86; margin: 18px 0 0; }

    .pl-meta .vs span { display: none; }

    .mx tbody th { font-size: 16px; }
    .mx thead th:first-child { width: 38%; }
    .num { display: none; }
    .closing .giant { font-size: 13.6vw; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
  @media print { .top, .corner, .prog, .ix, .lb, .vs, .legend .rp { display: none !important; } .pl { break-inside: avoid-page; } .rv .rv-i, .rv .rv-o { opacity: 1 !important; transform: none !important; } }

  function plate(s, i) {

        '<div class="pl-top"><h2 class="ttl" style="--ch:11">[Thank you]</h2></div>' +
        '<div class="pl-body two"><p class="hl">For your attention, and for the build we are about to start together.</p></div>' +
        '<div class="kv">' + kvRow("Email", '<a href="mailto:gometverdestudi@gmail.com">gometverdestudi@gmail.com</a>') + kvRow("Phone", '<a href="tel:+34684450515">+34 684 450 515</a>') +
        kvRow("Instagram", '<a href="https://www.instagram.com/gometverdestudi/" target="_blank" rel="noopener">@gometverdestudi ↗</a>') + kvRow("Studio", "Gomet Verd Estudi<br>Valencia · Barcelona") + '</div>' +
        '<p class="giant" aria-hidden="true">[Gomet Verd Estudi]</p></section>';
    }
    var hl = "", lead = [], rows = [], foot = [], dr = "", pillars = "", lgd = null, key = null, val = [];
    var flush = function () { if (key !== null) { rows.push(kvRow(esc(key), val.join(""))); key = null; val = []; } };
    var pushVal = function (h) { if (key !== null) val.push(h); else lead.push(h); };
    var sub = function (label, text) { return '<p class="sb"><span class="lbl">' + label + '</span>' + esc(text) + '</p>'; };
    s.blocks.forEach(function (b) {
      switch (b[0]) {
        case "h": case "lead": case "lead2":
          if (key !== null) val.push('<p class="kl">' + esc(b[1]) + '</p>');
          else if (!hl) hl = '<h3 class="hl' + (n === 2 ? ' big' : '') + '">' + esc(b[1]) + '</h3>';
          else lead.push('<p>' + esc(b[1]) + '</p>');
          break;
        case "p": case "caps": pushVal('<p>' + esc(b[1]) + '</p>'); break;
        case "rule": break;
        case "k": flush(); key = b[1]; break;
        case "note": flush(); rows.push(kvRow("", '<p class="note">' + esc(b[1]) + '</p>')); break;
        case "quote": if (key !== null) val.push('<p class="quote">“' + esc(b[1]) + '”</p>'); else rows.push(kvRow("", '<p class="quote">“' + esc(b[1]) + '”</p>')); break;
        case "img": dr = b[1] === "v09" ? rings() : b[1] === "v10" ? map() : (KIT && KIT.has(n) ? '<div class="draw" data-scene="' + n + '" role="img" aria-label="' + esc(b[2] || "") + '"></div>' : ""); break;

        case "legend": lgd = b[1]; break;

          else b[2].forEach(function (r) { rows.push(kvRow(esc(r[0]), r.slice(1).map(function (c, j) { return (r.length > 2 ? '<span class="sub sc">' + esc(b[1][j + 1]) + '</span>' : '') + '<span>' + esc(c) + '</span>'; }).join(""))); });
          break;
        case "steps":

        case "qa": flush(); b[1].forEach(function (q) { rows.push(kvRow(esc(q[0]), '<p>' + esc(q[1]) + '</p>')); }); break;
        case "pillars": pillars = '<div class="pil">' + b[1].map(function (p) { var name = p[1].toLowerCase(); return '<div><h3 class="sc">' + esc(p[1]) + '</h3><div class="draw" data-pillar="' + (name === "typography" ? "typo" : name) + '"></div><p>' + esc(p[2]) + '</p></div>'; }).join("") + '</div>'; break;
        case "meta": flush(); b[1].forEach(function (m) { foot.push('<span>' + (/sign-off|turnkey/i.test(m) ? '<b class="gm"></b>' : '') + esc(m) + '</span>'); }); break;
        case "contact": flush(); rows.push(kvRow("Contact", '<a href="mailto:gometverdestudi@gmail.com">gometverdestudi@gmail.com</a><br><a href="tel:+34684450515">+34 684 450 515</a><br><a href="https://www.instagram.com/gometverdestudi/" target="_blank" rel="noopener">@gometverdestudi ↗</a>')); break;
      }
    });
    flush();
    var legend = "";
    if (LEGEND[n]) legend = '<ol class="legend" data-for="' + n + '">' + LEGEND[n].map(function (t, k) { return '<li data-i="' + (k + 1) + '"><span class="n">' + (k + 1) + '</span>' + esc(t) + '</li>'; }).join("") + '<li><button class="rp sc" type="button">' + REPLAY + 'Replay</button></li></ol>';
    else if (dr.indexOf('data-scene') > 0) legend = '<ol class="legend" data-for="' + n + '"><li><button class="rp sc" type="button">' + REPLAY + 'Replay</button></li></ol>';
    var right = dr ? '<div class="dr">' + dr + '</div>' + (lead.length ? '<div class="lead xx">' + lead.join("") + '</div>' : '') : (lead.length ? '<div class="dr lead">' + lead.join("") + '</div>' : '');
    var kv = rows.join("");
    return '<section class="pl" id="slide-' + n + '" data-n="' + n + '">' +
      '<div class="pl-meta sc"><span>' + pad(n) + '</span><span>' + esc(s.sec) + '</span><span>' + esc(s.sub) + '</span><button class="vs sc" type="button" data-slide="' + n + '" title="View the original slide">' + SLIDEIC + '<span>Slide ' + pad(n) + '</span></button></div>' +
      '<div class="pl-top"><h2 class="ttl" style="--ch:' + s.title.length + '">' + esc(s.title) + '</h2><p class="num" aria-hidden="true">' + pad(n) + '<small>/' + N + '</small></p></div>' +
      (hl || right ? '<div class="pl-body two">' + hl + right + legend + '</div>' : '') + pillars +
      (kv ? '<div class="kv">' + kv + '</div>' : '') +
      (foot.length ? '<div class="pl-foot sc">' + foot.join("") + '</div>' : '') + '</section>';
  }
  $("read").innerHTML = D.map(plate).join("");

  /* ---------- drawings: built near the screen, played when in view, reset when gone ---------- */
  var players = [];
  function mountDraw(el) {
    if (el._st || !KIT) return el._st;
    if (el.hasAttribute("data-scene")) el._st = KIT.mount(el, +el.getAttribute("data-scene"));
    else if (el.hasAttribute("data-pillar")) el._st = KIT.pillar(el, el.getAttribute("data-pillar"));
    return el._st;
  }
  var near = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { mountDraw(e.target); near.unobserve(e.target); } }); }, { rootMargin: "120% 0px" });
  var seen = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      var el = e.target, st = mountDraw(el); if (!st) return;

      else if (e.intersectionRatio === 0 && el._on) { el._on = false; st.reset(); }
    });
  }, { threshold: [0, 0.45] });
  Array.prototype.forEach.call(document.querySelectorAll(".draw"), function (el) { near.observe(el); seen.observe(el); });
  // timeline icons: small finished buildings, one per phase
  Array.prototype.forEach.call(document.querySelectorAll(".tl .ico"), function (el) { if (KIT) KIT.phaseIcon(el, +el.getAttribute("data-ph")); });
  // HTML diagrams reveal once
  var rvo = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); rvo.unobserve(e.target); } }); }, { threshold: 0.25 });
  Array.prototype.forEach.call(document.querySelectorAll(".rv"), function (el) { if (RM) el.classList.add("in"); else rvo.observe(el); });

  // legend: replay, and point at the drawing
  $("read").addEventListener("click", function (e) {

  });
  var hover = function (on) { return function (e) { var li = e.target.closest && e.target.closest(".legend li[data-i]"); if (!li) return; var pl = li.closest(".pl"); li.classList.toggle("hi", on); Array.prototype.forEach.call(pl.querySelectorAll('.kit .mk[data-i="' + li.getAttribute("data-i") + '"]'), function (m) { m.classList.toggle("hi", on); }); }; };
  $("read").addEventListener("pointerover", hover(true));
  $("read").addEventListener("pointerout", hover(false));

  /* ---------- where we are ---------- */
  var cur = 1, lockUntil = 0;
  var setHash = function (n) { try { history.replaceState(null, "", location.pathname + location.search + "#slide-" + n); } catch (e) {} };
  function paint() {
    $("count").textContent = pad(cur) + " / " + N;
    Array.prototype.forEach.call(document.querySelectorAll(".tile"), function (t) { t.classList.toggle("cur", +t.getAttribute("data-n") === cur); });
  }
  var cio = new IntersectionObserver(function (es) {
    if (Date.now() < lockUntil) return;
    es.forEach(function (e) { if (e.isIntersecting) { var n = +e.target.getAttribute("data-n"); if (n !== cur) { cur = n; setHash(cur); paint(); } } });
  }, { rootMargin: "-45% 0px -54% 0px" });
  Array.prototype.forEach.call(document.querySelectorAll(".pl"), function (el) { cio.observe(el); });
  var ticking = false;
  window.addEventListener("scroll", function () {
    if (ticking) return; ticking = true;
    requestAnimationFrame(function () { var h = document.documentElement.scrollHeight - innerHeight; $("prog").style.width = (h > 0 ? scrollY / h * 100 : 0) + "%"; ticking = false; });
  }, { passive: true });
  function go(n, smooth) {
    cur = Math.min(N, Math.max(1, n)); var el = $("slide-" + cur); if (!el) return;
    lockUntil = Date.now() + 900;

    setHash(cur); paint();
  }

  /* ---------- index ---------- */
  var ix = $("ix"), g = "";
  for (var n = 1; n <= N; n++) g += '<button class="tile" data-n="' + n + '"><img loading="lazy" src="slides/t' + pad(n) + '.webp" alt="" width="480" height="270"><span class="cap"><span>' + pad(n) + ' ' + esc(D[n - 1].name || "") + '</span><span>' + esc(sectionOf(n)) + '</span></span></button>';
  $("ixGrid").innerHTML = g;
  function lock() { root.classList.toggle("is-locked", ix.classList.contains("open") || $("lb").classList.contains("open")); }
  function openIx() { ix.classList.add("open"); lock(); paint(); var c = ix.querySelector(".tile.cur"); if (c) c.scrollIntoView({ block: "center" }); }

  $("ixClose").onclick = closeIx;
  $("ixGrid").addEventListener("click", function (e) { var t = e.target.closest(".tile"); if (t) { closeIx(); go(+t.getAttribute("data-n")); } });

  $("lbClose").onclick = closeLb;

  /* ---------- keys ---------- */
  document.addEventListener("keydown", function (e) {

  });

  /* ---------- start ---------- */
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  var m = /slide-(\d+)/.exec(location.hash);
  if (m && +m[1] > 1) { var target = +m[1]; requestAnimationFrame(function () { go(target); }); if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (scrollY > 0) go(target); }); }
  paint();
})();
