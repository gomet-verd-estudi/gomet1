<style>
  /* Archivo: SIL Open Font License 1.1 (fonts/OFL.txt), subset to Latin, width 62–100, weight 400–900 */
  @font-face { font-family: "Archivo"; src: url("fonts/archivo-var.woff2") format("woff2"); font-weight: 200 900; font-stretch: 62% 100%; font-style: normal; font-display: swap; }
  /* the Gomet web system: one light grey for every letter, one green ink for every drawing, on white */
  :root {

  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body { background: var(--white); color: var(--g); font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-size: var(--fs); font-weight: 500; line-height: 1.07; letter-spacing: -.004em; -webkit-font-smoothing: antialiased; overflow-x: hidden; overflow-x: clip; }

  .sc { font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; line-height: 1.15; }

  /* ---------- chrome: small and fixed in the corners ---------- */
  .prog { position: fixed; top: 0; left: 0; height: 2px; width: 0; background: var(--mi); z-index: 31; }
  .top { position: fixed; top: 0; left: 0; right: 0; height: var(--hd); z-index: 30; display: flex; align-items: center; justify-content: space-between;
    padding: 0 max(var(--pad), env(safe-area-inset-right)) 0 max(var(--pad), env(safe-area-inset-left)); pointer-events: none; }
  .top > * { pointer-events: auto; }
  .gve { display: inline-flex; text-decoration: none; }
  .gve span { width: 26px; height: 26px; display: grid; place-items: center; border: 1.5px solid var(--g); border-radius: 4px; margin-left: -1.5px; font-size: 13px; font-weight: 800; color: var(--g); line-height: 1; background: var(--white); }
  .gve span:first-child { margin-left: 0; }
  .pill { display: inline-flex; align-items: center; gap: 9px; height: 34px; padding: 0 14px; border-radius: 999px; background: rgba(255, 255, 255, .9); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    font-size: 14.5px; font-weight: 700; letter-spacing: .02em; color: var(--g); font-variant-numeric: tabular-nums; box-shadow: 0 0 0 1.5px var(--g) inset; }
  .pill svg { width: 13px; height: 13px; }
  .pill:hover, .pill:focus-visible { box-shadow: 0 0 0 1.5px var(--mi) inset; color: var(--mi); outline: none; }
  .tr2 { display: inline-flex; align-items: center; gap: 8px; }
  .lng { display: inline-flex; align-items: center; height: 34px; padding: 3px; gap: 2px; border-radius: 999px; background: rgba(255, 255, 255, .9); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 0 0 1.5px var(--g) inset; }
  .lng a { display: grid; place-items: center; min-width: 32px; height: 28px; padding: 0 6px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: .08em; color: var(--g); text-decoration: none; }
  .lng a.on { background: var(--g); color: var(--white); }
  .lng a:not(.on):hover { color: var(--mi); }
  .tile .tnum { display: flex; align-items: flex-end; height: 74px; padding: 8px 10px; font-weight: 200; font-stretch: 62%; font-size: 56px; line-height: .8; color: var(--g); }
  .corner { position: fixed; bottom: 9px; z-index: 30; color: var(--g); text-decoration: none; background: var(--white); padding: 4px 7px; border-radius: 4px; }
  .corner.l { left: max(var(--pad), env(safe-area-inset-left)); margin-left: -7px; }
  .corner.r { right: max(var(--pad), env(safe-area-inset-right)); margin-right: -7px; }
  .corner:hover { color: var(--mi); }
  @media (max-width: 899px) { .corner { display: none; } }

  /* ---------- plates ---------- */
  .pl { position: relative; padding: calc(var(--hd) + 3vh) var(--pad) clamp(72px, 11vh, 132px); }
  /* blocks are separated like a building site: a band of thick 45° stripes, edge to edge */
  .pl::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 14px; background: repeating-linear-gradient(-45deg, var(--g) 0 6px, transparent 6px 12px); pointer-events: none; }
  .pl.cover::before { display: none; }
  .pl-meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; text-align: center; gap: 4px 26px; }

  .pl-meta .vs:hover { color: var(--mi); }
  .pl-meta .vs svg { width: 13px; height: 13px; }
  /* the title is a statement on the centre axis: its number, thin, stacked on top; the word itself in a lighter cut */
  .pl-top { display: flex; flex-direction: column; align-items: center; text-align: center; margin-top: 14px; }
  .pno { font-weight: 200; font-stretch: 62%; font-size: clamp(30px, 3.4vw, 62px); line-height: .8; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-bottom: .1em; }
  .ttl { font-weight: 560; font-stretch: 62%; font-size: min(clamp(70px, 12.6vw, 232px), calc((100vw - 2 * var(--pad)) / (var(--ch, 10) * .38))); line-height: .8; letter-spacing: -.022em; }
  .two { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); column-gap: var(--pad); }
  .pl-body { margin-top: clamp(26px, 4.5vh, 56px); grid-template-areas: "hl dr" "lg dr" "xx dr"; grid-template-rows: auto auto 1fr; align-items: start; }
  .hl { grid-area: hl; font-size: clamp(25px, 2.35vw, 44px); line-height: .93; font-weight: 640; letter-spacing: -.015em; max-width: 13.5em; text-wrap: balance; }
  .hl.big { font-weight: 900; font-stretch: 62%; font-size: clamp(42px, 6vw, 112px); line-height: .84; letter-spacing: -.01em; max-width: 9em; }

  .xx { grid-area: xx; margin-top: 1.4em; max-width: 26em; }
  .lead p + p, .kv-v p + p { margin-top: .8em; }

  .lead > p:first-child::before, .mf-p::before { content: ""; position: absolute; left: -.7em; top: .34em; width: .4em; height: .4em; border-radius: 50%; background: var(--mi); }
  .legend { grid-area: lg; list-style: none; margin-top: 1.1em; font-weight: 700; }
  .legend li { display: flex; align-items: center; gap: .45em; padding: 1px 0; line-height: 1.02; cursor: default; }
  .legend .n { flex: none; width: 22px; height: 22px; display: inline-grid; place-items: center; border: 2px solid var(--g); border-radius: 50%; font-size: 11px; font-weight: 800; font-variant-numeric: tabular-nums; transition: background .2s, color .2s; }
  .legend li.hi .n { background: var(--g); color: var(--white); }
  .kv { margin-top: clamp(30px, 6vh, 76px); }
  .kv-row { padding: .45em 0; }
  .kv-k { font-weight: 800; }
  .kv-k i, .kv-v .lbl i { font-style: normal; font-weight: 500; margin-right: .2em; }
  .kv-v .kl { font-weight: 800; letter-spacing: -.012em; }
  .kv-v .kl + p:not(.sb) { margin-top: .25em; }
  .kv-v .sb { margin-top: .6em; }
  .kv-v .kl + .sb, .kv-v .sb:first-child { margin-top: .45em; }
  .kv-v .lbl { display: block; margin-bottom: .2em; font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; line-height: 1.25; }
  .kv-v .sub { display: block; margin: .6em 0 .3em; }
  .kv-v .sub:first-child { margin-top: 0; }
  .kv-v .quote { font-weight: 900; font-stretch: 62%; font-size: 1.9em; line-height: .88; letter-spacing: -.01em; text-wrap: balance; }
  .kv-v .quote + *, .kv-v * + .quote { margin-top: .6em; }
  .kv-v a { text-decoration: none; } .kv-v a:hover { color: var(--mi); }
  .gm { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--mi); margin-right: 7px; }
  .pl-foot { margin-top: clamp(28px, 5vh, 64px); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 24px; }

  /* ---------- the green plate: sticky in its block, printed over the grey letters in multiply ---------- */
  .stage { position: sticky; z-index: 3; pointer-events: none; mix-blend-mode: multiply;
    margin-top: var(--ht, 30vh); top: var(--ht, 30vh); height: var(--hh, 40vh); width: 100%; }
  /* the plate rides on a track as tall as its block: fixed while the block lasts, then it leaves with it */
  .track { position: absolute; left: var(--pad); right: var(--pad); top: 0; bottom: 0; pointer-events: none; }
  /* each block opens as a sheet the size of the screen: title on top, texts at the foot,
     and the drawing exactly in the hole left between them; the rest of the text then runs over it */
  /* the sheet pins when its block reaches the top: the page stands still while the scroll builds the
     drawing, and moves on only once the drawing is finished */
  .pl.st { padding-top: 0; }
  /* room at the end of the block the size of the drawing: when the plate finally lets go and leaves
     with the scroll, it travels over empty paper, never over the text */
  .pl.st { padding-bottom: var(--pb, calc(var(--hh, 40vh) + 6vh)); }
  .st .track { bottom: var(--tb, 0px); }
  .pin { position: relative; height: calc(100vh + var(--runv, 150vh)); height: calc(100svh + var(--run, 150svh)); }
  .lam { position: sticky; top: 0; display: flex; flex-direction: column; height: 100vh; height: 100svh; padding: calc(var(--hd) + 3vh) 0 calc(3vh + 16px); }
  .hole { flex: 1 1 auto; min-height: 26vh; min-height: 26svh; }
  /* the title waits at the top: it stays sticky after the sheet lets go, until the text below comes up to
     its usual distance; from there title and text travel together, as one block */
  .tw { position: absolute; left: 0; right: 0; top: 0; height: var(--wh, 100vh); padding-top: calc(var(--hd) + 3vh); pointer-events: none; z-index: 1; }
  .hd2 { position: sticky; top: calc(var(--hd) + 3vh); pointer-events: auto; }
  .hsp { flex: none; height: var(--hdh, 0px); }
  .lam-foot { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 4fr) minmax(0, 3fr); column-gap: var(--pad); align-items: start; position: relative; padding-top: 8px; }
  .lam-foot > * { grid-area: auto; grid-row: 1; }

  .lam-foot .legend { grid-column: 3; margin-top: 0; }
  .lam-foot:not(.has-lg) .lead { grid-column: 2 / 4; max-width: 30em; }
  .stage .mapw { width: min(100%, calc(var(--hh, 40vh) * 1.42)); }
  .stage .rings { width: min(100%, calc(var(--hh, 40vh) * 2.1)); }
  .stage .draw { position: absolute; inset: 0; }
  .stage .kit .mk { display: none; }
  .stage .draw .kit { position: absolute; inset: 0; }
  .stage.dg { display: grid; place-items: center; }
  .flow { position: relative; z-index: 1; }
  .st .flow { display: flex; flex-direction: column; }

  /* the four pillars: four drawings on the plate, four texts passing under them */
  .pil-st { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--pad); width: 100%; height: 100%; }
  .pil-st .draw { position: relative; inset: auto; }
  .pil-st .lab { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; color: var(--mi); }
  /* the pillars in 3D: white faces, green edges, like the rest of the drawings */
  .p3 { position: absolute; left: 0; right: 0; top: 0; bottom: 22px; width: 100%; height: calc(100% - 22px); overflow: visible; }
  .p3 path { stroke: var(--mi); stroke-width: 1.3px; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .p3 .fw { fill: #FFFFFF; } .p3 .fg { fill: var(--mi); } .p3 .f1 { fill: #6CC593; } .p3 .f2 { fill: #ABDABD; } .p3 .f3 { fill: #E1E9DB; }
  .p3 .ln { fill: none; } .p3 .lt { stroke-width: .8px; opacity: .55; }
  .pil { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 40px var(--pad); margin-top: clamp(28px, 5vh, 56px); }
  .pil figure { margin: 0; }
  .pil .pd { position: relative; aspect-ratio: 1 / 1; margin-bottom: 18px; }

  .pil h3 { margin-bottom: .5em; }

  /* the opener: two scales only. A small, dense paragraph on the left axis; three statements, huge, on the centre axis,
     each under its own thin number, printed over the small type in multiply */
  .mf { padding-bottom: clamp(72px, 14vh, 160px); }
  .mf-p { margin-top: clamp(26px, 5vh, 60px); max-width: 44em; text-wrap: pretty; }
  .mf-side { margin-top: 1.1em; line-height: 1.25; }
  .mf-side span { display: block; }
  .mf-st { list-style: none; position: relative; z-index: 2; mix-blend-mode: multiply; text-align: center; margin-top: calc(var(--fs) * -2.7);
    font-weight: 560; font-stretch: 62%; text-transform: uppercase; font-size: clamp(56px, 9.2vw, 176px); line-height: .8; letter-spacing: -.02em; }
  .mf-st li { text-wrap: balance; }
  .mf-st li + li { margin-top: .08em; }
  .mf-st i { display: block; font-style: normal; font-weight: 200; font-size: .62em; line-height: .9; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

  /* cover and closing */
  .cover { min-height: 100vh; min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; padding-bottom: clamp(32px, 6vh, 72px); border-top: 0; }
  .cover .logo { align-self: center; justify-self: center; width: min(84vw, 1100px); margin: 4vh 0; }
  .cover .bot { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
  .cue { text-decoration: none; white-space: nowrap; }
  .closing .giant { margin-top: clamp(48px, 10vh, 120px); font-weight: 560; font-stretch: 62%; font-size: 14.2vw; line-height: .8; letter-spacing: -.02em; white-space: nowrap; text-align: center; }

  /* ---------- diagrams in the same green line ---------- */
  .rings { position: relative; width: 100%; aspect-ratio: 682 / 300; }
  .rings svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .rings ellipse { fill: var(--blank); stroke: var(--mi); stroke-width: 1.6; transform-box: fill-box; transform-origin: center; }
  .rings .o { fill: none; stroke-dasharray: 5 5; }
  .rings .i { stroke-width: 2.6; }
  .rings span { position: absolute; left: 50%; transform: translate(-50%, -50%); color: var(--mi); opacity: 0; transition: opacity .4s ease; }
  .rings span.on { opacity: 1; }
  .mapw { width: 100%; }
  .map { position: relative; width: 100%; aspect-ratio: 1140 / 702; }
  .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map .ax { stroke: var(--mi); stroke-width: 1.4; fill: none; }
  .map .tk { stroke: var(--mi); stroke-width: 1.2; fill: none; transition: opacity .4s; }
  .map .op { fill: var(--blank); stroke: var(--mi); stroke-width: 1.4; stroke-dasharray: 5 5; transition: opacity .5s; }
  .map .d { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--mi); transform: translate(-50%, -50%) scale(0); transition: transform .45s cubic-bezier(.3, 1.6, .5, 1); }
  .map .d.b { background: var(--blank); border: 2px solid var(--mi); }
  .map .d.on { transform: translate(-50%, -50%) scale(1); }
  .map .pill2 { position: absolute; transform: translate(-50%, -50%); background: var(--blank); color: var(--mi); border: 1.5px solid var(--mi); border-radius: 999px; padding: 5px 10px; white-space: nowrap; font-size: clamp(9px, 1.3vw, 11px); opacity: 0; transition: opacity .4s; }
  .map .pill2.w { left: 0 !important; transform: translate(0, -50%); }
  .map .pill2.e { left: auto !important; right: 0; transform: translate(0, -50%); }
  .map .pill2.you { background: var(--mi); color: var(--blank); }
  .map .open { position: absolute; right: 2%; bottom: 7.5%; color: var(--mi); opacity: 0; transition: opacity .4s; }
  .map .pill2.on, .map .open.on { opacity: 1; }
  .mlg { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 16px; color: var(--mi); }
  .mlg span { display: inline-flex; align-items: center; gap: 8px; }
  .m { display: inline-block; width: 13px; height: 13px; border-radius: 50%; vertical-align: middle; flex: none; position: relative; z-index: 1; }
  .m.f { background: var(--mi); }
  .m.o { border: 2px solid var(--mi); background: var(--white); }
  .m.c { width: 17px; height: 17px; }
  .m.c svg, .so svg { width: 100%; height: 100%; display: block; }
  .tl { list-style: none; position: relative; margin-top: 2vh; }
  .tl::before { content: ""; position: absolute; left: 11px; top: 30px; bottom: 30px; width: 1px; background: var(--mi); }
  .tl li { position: relative; padding-left: 40px; }
  .tl .act { padding: 22px 0 4px 40px; }
  .tl .act:first-child { padding-top: 0; }
  .tl .ph { display: grid; grid-template-columns: clamp(92px, 9vw, 150px) 1fr; align-items: center; gap: 14px; padding: 4px 0; }
  .tl .ph::before { content: ""; position: absolute; left: 5px; top: 50%; width: 13px; height: 1px; background: var(--mi); }
  /* the small buildings: only the construction, in a fine line (no people, stamps or dense floor grid) */
  .tl .ico .grid { opacity: .2 !important; }
  .tl .ico .ppl, .tl .ico use.under, .tl .ico .gv, .tl .ico .labels { display: none; }
  .tl .ico { display: block; position: relative; height: clamp(70px, 7vw, 110px); }
  .tl .ph b { font-weight: 800; }
  .tl .ph i { font-style: normal; font-weight: 500; margin-right: .35em; }
  .tl .ph span { display: block; }
  .tl .so-r { height: 32px; display: flex; align-items: center; }
  .so { position: absolute; width: 21px; height: 21px; left: 1px; top: 50%; transform: translateY(-50%); }
  .tr { margin-top: 2vh; }
  .tr-h, .tr-r { display: grid; grid-template-columns: 1fr 44px 1fr; column-gap: 16px; }
  .tr-h span { padding-bottom: 10px; }
  .tr-h span:first-child, .tr-t { text-align: right; }
  .tr-r { align-items: center; }
  .tr-t, .tr-c { padding: 12px 0; }
  .tr-t i { display: block; font-style: normal; }
  .tr-m { position: relative; align-self: stretch; }
  .tr-m svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .tr-m path { fill: none; stroke: var(--mi); stroke-width: 1.6; }
  .tr-m .so { top: auto; bottom: 0; transform: translate(-50%, 50%); }
  .tr-m .so.l { left: 4px; } .tr-m .so.r { left: 40px; }
  .mx { width: 100%; border-collapse: collapse; margin-top: 2vh; table-layout: fixed; }
  .mx thead th { vertical-align: bottom; padding: 0 2px 10px; text-align: center; font-weight: 800; letter-spacing: .06em; font-size: 10px; overflow-wrap: anywhere; }
  .mx thead th:first-child { width: 34%; }
  .mx thead th.you { color: var(--mi); }
  .mx tbody th { text-align: left; font-weight: 500; padding: 9px 6px 9px 0; border-top: 1px solid var(--g0); }
  .mx tbody th i { font-style: normal; margin-right: .4em; }
  .mx td { text-align: center; border-top: 1px solid var(--g0); position: relative; }
  .mx td.ln::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--mi); }
  .mx tr:first-child td.ln::before { top: 50%; }
  .mx tr:last-child td.ln::before { bottom: 50%; }
  @media (max-width: 599px) { .mx thead th span { writing-mode: vertical-rl; transform: rotate(180deg); display: inline-block; white-space: nowrap; text-align: left; } }
  .gv-s circle { fill: var(--mi); } .gv-s path { fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  /* the table-like diagrams build row by row as they come up the screen, and unbuild going back */
  .rv-i { opacity: 0; transform: translateY(16px); transition: opacity .5s ease, transform .6s cubic-bezier(.2, .8, .2, 1); }
  .rv-o { opacity: 0; transition: opacity .5s ease; }

  var lb = $("lb"), lbImg = $("lbImg"), lbSc = $("lbSc");
  function openLb(src, cap) { lbImg.onload = function () { lbSc.scrollLeft = 0; }; lbImg.src = src; lbImg.alt = cap; $("lbCap").textContent = cap; lb.classList.add("open"); lock(); }
  function closeLb() { lb.classList.remove("open"); lbImg.removeAttribute("src"); lock(); }
  $("lbClose").onclick = closeLb;

  /* ---------- keys ---------- */
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === "Escape") { if (lb.classList.contains("open")) closeLb(); else closeIx(); return; }
    if (lb.classList.contains("open")) return;
    if (k === "g" || k === "G") { ix.classList.contains("open") ? closeIx() : openIx(); return; }
    if (ix.classList.contains("open")) return;
    if (k === "ArrowRight") { e.preventDefault(); go(cur + 1, true); }
    else if (k === "ArrowLeft") { e.preventDefault(); go(cur - 1, true); }
  });

  /* ---------- start ---------- */
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  var m = /slide-(\d+)/.exec(location.hash);
  if (m && +m[1] > 1) { var target = +m[1]; requestAnimationFrame(function () { go(target); update(); }); if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (scrollY > 0) go(target); update(); }); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { holes(); update(); });
  window.addEventListener("load", function () { holes(); update(); });
  paint(); update();
})();
</script>
</body>
