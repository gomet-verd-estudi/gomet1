    border-top: 1px solid var(--g); border-bottom: 1px solid var(--g); }

  .sign > div:first-child { border-left: 0; }
  .sign .ref { background: var(--paper); padding-bottom: 8px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
  .sign .ref svg { display: block; width: 100%; max-width: 220px; height: 30px; }
  .sign .ref rect { fill: var(--g); }

  /* ---------- construction kit × technical drawing ----------
     Flowchart block arrows join the plates; every drawing is a figure in a ruled box with a typed caption (FIG. n);
     the callouts hang on curved leaders, as on a patent sheet; the pillars are catalogue cells with a part code;
     the folded sheets are numbered instruction lists. The technical hand is a monospace */
  :root { --mono: "Space Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; }
  .pl:not(.cover):not(.pil-after)::after { content: ""; position: absolute; left: 50%; top: calc(14px + (var(--hd) - 15px - 26px) / 2); width: 26px; height: 26px; margin-left: -13px; z-index: 2; pointer-events: none;
    background: var(--g); -webkit-clip-path: polygon(32% 0, 68% 0, 68% 48%, 100% 48%, 50% 100%, 0 48%, 32% 48%); clip-path: polygon(32% 0, 68% 0, 68% 48%, 100% 48%, 50% 100%, 0 48%, 32% 48%); }
  .pl.pil-after + .pl::after { top: calc((var(--hd) - 1px - 26px) / 2); }
  @media (max-width: 899px) { .pl:not(.cover):not(.pil-after)::after { top: calc(10px + (var(--hd) - 11px - 26px) / 2); } .pl.pil-after + .pl::after { top: calc((var(--hd) - 1px - 26px) / 2); } }
  /* the box starts a little under the hole's top: the brackets and descenders of the big title hang below its line */
  .fig { position: absolute; inset: max(14px, min(3vh, 1.9vw)) 0 10px; display: flex; flex-direction: column; border: 1px solid var(--g); transition: border-color .35s ease; }
  /* the box and its caption are the plate of a step: they show while the step stands pinned, and step aside while pages move */
  .fig-c { transition: opacity .35s ease, border-color .35s ease; }
  .obra:not(.pinned) .ob-stage .fig, .pl.st:not(.pinned) .stage .fig { border-color: transparent; }
  .obra:not(.pinned) .ob-stage .fig-c, .pl.st:not(.pinned) .stage .fig-c { opacity: 0; border-bottom-color: transparent; }
  .fig-c { flex: none; display: flex; gap: 12px; align-items: baseline; min-height: 28px; padding: 6px 10px 5px; border-bottom: 1px solid var(--g);
    font-family: var(--mono); font-size: 11px; line-height: 1.3; letter-spacing: 0; text-transform: uppercase; color: var(--g); }
  .fig-c b { flex: none; font-weight: 700; }
  .fig-c span { min-width: 0; }
  .fig-a { position: relative; flex: 1 1 auto; min-height: 0; }
  .fig .fig-a > .draw { position: absolute; inset: 4px; }
  .stage .fig-a .kit { position: absolute; inset: 0; }
  .vcode span, .sign .ref span { font-family: var(--mono); letter-spacing: .08em; }

  /* ---------- more detail, folded ----------
     The button is the last row of the foot's table: a small label, what is inside, and a green + that turns into a −.
     The sheet it opens is a ruled table on the same thin paper as the foot, frame to frame; it unfolds from the foot */
  .more-b { display: flex; align-items: center; gap: 8px 18px; width: 100%; min-height: 40px; padding: 8px var(--pad) 8px; text-align: left; border-top: 1px solid var(--g); cursor: pointer; }
  .tab > .more-b.more-b { grid-column: 1 / -1; grid-row: 3; padding: 8px var(--pad) 8px; border-left: 0; }
  .more-b .more-t { flex: none; }
  .more-b .more-s { flex: 1 1 auto; min-width: 0; font-size: clamp(14px, 1vw, 17px); line-height: 1.15; }
  .more-i { flex: none; position: relative; width: 24px; height: 24px; border-radius: 50%; background: var(--mi); transition: transform .35s cubic-bezier(.3, .8, .3, 1); }
  .more-i::before, .more-i::after { content: ""; position: absolute; left: 6px; right: 6px; top: 11px; height: 2px; background: #fff; border-radius: 1px; }
  .more-i::after { transform: rotate(90deg); transition: transform .35s cubic-bezier(.3, .8, .3, 1); }
  .more-b[aria-expanded="true"] .more-i::after { transform: rotate(0deg); }
  .more-b:hover .more-s, .more-b:focus-visible .more-s { color: var(--mi); }
  .more-b:focus-visible { outline: 2px solid var(--mi); outline-offset: -2px; }
  .more-row { margin: clamp(36px, 7vh, 80px) calc(var(--fi) - var(--pad)) 0; border-bottom: 1px solid var(--g); }
  .more-row .more-b { border-top: 1px solid var(--g); }
  .more-p { position: relative; z-index: 4; display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s cubic-bezier(.3, .8, .3, 1); margin: 0 var(--fi); }
  .pl .more-p { margin: 0 calc(var(--fi) - var(--pad)); }
  .more-p.open { grid-template-rows: 1fr; }
  .more-c { min-height: 0; overflow: hidden; }
  .more-p:not(.open) .more-c { visibility: hidden; transition: visibility 0s .5s; }
  .more-in { background: rgba(255, 255, 255, .86); border-bottom: 1px solid var(--g);
    font-size: clamp(16px, 1.2vw, 21px); line-height: 1.15; padding-bottom: clamp(18px, 3vh, 32px); }
  .more-bar { background: var(--paper); border-bottom: 1px solid var(--g); padding: 7px var(--pad) 6px; }
  .more-in > .more-bar:not(:first-child) { border-top: 1px solid var(--g); margin-top: clamp(10px, 2vh, 20px); }
  .more-r { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); border-bottom: 1px solid var(--g); }
  .more-k { padding: 9px var(--pad) 10px; font-weight: 800; }
  .more-v { padding: 9px var(--pad) 10px; border-left: 1px solid var(--g); max-width: 52em; }
  .more-in > .more-r:last-child { border-bottom: 0; }
  @media print { .more-p { grid-template-rows: 1fr !important; } .more-c { visibility: visible !important; } .more-b { display: none; } }

  /* ---------- the green plate: sticky in its block, printed over the grey letters in multiply ---------- */
  .stage { position: sticky; z-index: 3; pointer-events: none; mix-blend-mode: multiply;
    margin-top: var(--ht, 30vh); top: var(--ht, 30vh); height: var(--hh, 40vh); width: 100%; }
  /* the plate rides on a track as tall as its block: fixed while the block lasts, then it leaves with it */
  .track { position: absolute; left: var(--pad); right: var(--pad); top: 0; bottom: 0; pointer-events: none; }
  /* each block opens as a sheet the size of the screen: title on top, texts at the foot,
     and the drawing exactly in the hole left between them; the rest of the text then runs over it */
  /* the sheet pins when its block reaches the top: the page stands still while the scroll builds the
     drawing, and moves on only once the drawing is finished */
  .pl.st { padding-top: 0; }
  /* room at the end of the block the size of the drawing: when the plate finally lets go and leaves
     with the scroll, it travels over empty paper, never over the text */
  .pl.st { padding-bottom: var(--pb, calc(var(--hh, 40vh) + 6vh)); }
  .st .track { bottom: var(--tb, 0px); }
  /* the steps: one drawing over all of them, printed in multiply. It waits in the same place for the whole run of steps
     while the grey titles, texts and bands slide under it; at the end it rests on blank paper and leaves */
  .obra { position: relative; padding-bottom: var(--opb, 60vh); }
  .ob-track { position: absolute; left: var(--pad); right: var(--pad); top: 0; bottom: 0; pointer-events: none; z-index: 3; mix-blend-mode: multiply; }
  .ob-stage { position: sticky; top: var(--ost, 30vh); margin-top: var(--ost, 30vh); height: var(--osh, 40vh); width: 100%; }
  .ob-stage .draw { position: absolute; inset: 0; }
  .obra > .pl { z-index: 1; }
  .pl.st.ob { padding-bottom: clamp(40px, 7vh, 88px); }
  /* the 3D pillars come on a sheet of thin paper laid over the drawing: white, but you can still make out the building under it */
  /* a light sheet, like thin paper: the building shows through it, softened; flat, it casts no shadow.
     It starts right under the step's description: the step's foot and the sheet meet on the same rule */
  .obra > .pl.pil-after { z-index: 4; background: rgba(255, 255, 255, .6); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    padding-top: clamp(28px, 5vh, 56px); }
  /* the step before a sheet: its description is already on the sheet. Its foot is lifted over the building and printed on the
     same thin paper, so when the pin lets go the foot and the sheet are one piece, from the description down */
  .obra > .pl.pre, .pl.pre > .flow { z-index: auto; }
  .pl.pre .lam { z-index: 4; }
  .pl.pre .lam-foot { background: rgba(255, 255, 255, .72); }
  .pin { position: relative; height: calc(100vh + var(--runv, 150vh)); height: calc(100svh + var(--run, 150svh)); }
  .lam { position: sticky; top: 0; display: flex; flex-direction: column; height: 100vh; height: 100svh; padding: calc(var(--hd) - 1px) 0 calc(3vh + 16px); }
  .hole { flex: 1 1 auto; min-height: 26vh; min-height: 26svh; }
  /* the title waits at the top: it stays sticky after the sheet lets go, until the text below comes up to
     its usual distance; from there title and text travel together, as one block */
  .tw { position: absolute; left: 0; right: 0; top: 0; height: var(--wh, 100vh); padding-top: calc(var(--hd) - 1px); pointer-events: none; z-index: 1; }
  .hd2 { position: sticky; top: calc(var(--hd) - 1px); pointer-events: auto; }
  .hsp { flex: none; height: var(--hdh, 0px); }
  .lam-foot { position: relative; }
  .stage .mapw { width: min(100%, calc(var(--hh, 40vh) * 1.42)); }
  .stage .rings { width: min(100%, calc(var(--hh, 40vh) * 2.1)); }
  .stage .draw { position: absolute; inset: 0; }
  .stage .kit .mk { display: none; }
  .stage .draw .kit { position: absolute; inset: 0; }
  .stage.dg { display: grid; place-items: center; }
  .flow { position: relative; z-index: 1; }
  .st .flow { display: flex; flex-direction: column; }
  .st .flow > .kv, .st .flow > .pil { margin-top: 6vh; }
  .st .flow > .pl-foot { margin-top: auto; padding-top: 6vh; }

  /* the four pillars: four drawings on the plate, four texts passing under them */
  .pil-st { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--pad); width: 100%; height: 100%; }
  .pil-st .draw { position: relative; inset: auto; }
  .pil-st .lab { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; color: var(--mi); }
  /* the pillars in 3D: white faces, green edges, like the rest of the drawings */
  .p3 { position: absolute; left: 0; right: 0; top: 0; bottom: 22px; width: 100%; height: calc(100% - 22px); overflow: visible; }
  .p3 path { stroke: var(--mi); stroke-width: 1.3px; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .p3 .fw { fill: #FFFFFF; } .p3 .fg { fill: var(--mi); } .p3 .f1 { fill: #6CC593; } .p3 .f2 { fill: #ABDABD; } .p3 .f3 { fill: #E1E9DB; }
  .p3 .ln { fill: none; } .p3 .lt { stroke-width: .8px; opacity: .55; }
  /* the light on the solids: a cast shadow in the palest green on a short floor line, and the hidden edges dashed, as on a technical drawing */
  .p3 .sh { fill: #E6F1E9; stroke: none; }
  .p3 .fl { fill: none; stroke-width: 1px; opacity: .5; }
  .p3 .hd { fill: none; stroke-width: .8px; stroke-dasharray: 3 3; opacity: .42; }
  .pil { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; margin: clamp(28px, 5vh, 56px) calc(var(--fi) - var(--pad)) 0; border-top: 1px solid var(--g); border-bottom: 1px solid var(--g); }
  .pil figure { position: relative; margin: 0; padding: 18px var(--pad) 16px; border-left: 1px solid var(--g); }
  .pil figure:first-child { border-left: 0; }
  .pl.pil-after { padding-top: 0; }
  .pl.pil-after::before { display: none; }
  /* the construction band that closes the pillars belongs to the paper sheet: it sits at its foot, and the next step opens without one */
  .pl.pil-after::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: repeating-linear-gradient(-45deg, var(--g) 0 6px, transparent 6px 12px); pointer-events: none; }
  .pl.pil-after + .pl::before { display: none; }
  .pl.pil-after .pil { margin-top: 0; }
  .pil .pd { position: relative; z-index: 2; aspect-ratio: 1 / 1; margin-bottom: 18px; }
  .pil .pd .p3 { inset: 0; width: 100%; height: 100%; }
  .pil h3 { margin: 0 calc(-1 * var(--pad)) .6em; background: var(--paper); border-top: 1px solid var(--g); border-bottom: 1px solid var(--g); padding: 6px var(--pad) 5px; }

  /* the opener: two scales only. A small, dense paragraph on the left axis; three statements, huge, on the centre axis,
     each under its own thin number, printed over the small type in multiply */
  .mf { padding-bottom: clamp(72px, 14vh, 160px); }
  .mf-t { margin-top: -1px; border-top: 0; }
  .mf-t > .lead { padding-top: 14px; padding-bottom: 16px; }
  .tab.one { grid-template-columns: minmax(0, 1fr); }
  .tab.one > :nth-child(2n) { border-left: 0; }
  .mf-t .lead { max-width: 46em; text-wrap: pretty; }
  .mf-side { margin-top: 1.1em; line-height: 1.25; }
  .mf-side span { display: block; }
  .mf-st { list-style: none; position: relative; z-index: 2; mix-blend-mode: multiply; text-align: center; margin-top: -.34em; /* the big statements, printed over the foot of the small text in multiply: they touch it, they do not bury it */
    font-weight: 560; font-stretch: 62%; text-transform: uppercase; font-size: clamp(56px, 9.2vw, 176px); line-height: .8; letter-spacing: -.02em; }
  .mf-st li { text-wrap: balance; }
  .mf-st li + li { margin-top: .32em; }
  .mf-st i { display: block; font-style: normal; font-weight: 200; font-size: .62em; line-height: .9; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

  /* cover and closing */
  .cover { min-height: 100vh; min-height: 100svh; display: grid; grid-template-rows: 1fr auto; padding-bottom: clamp(28px, 5vh, 64px); border-top: 0; }
  .cover .logo { align-self: center; justify-self: center; width: min(84vw, 1100px); margin: 4vh 0; }
  /* the one thing to do on the cover: scroll. Centred, big, with a long thin arrow that breathes */
  .cue { justify-self: center; display: flex; flex-direction: column; align-items: center; gap: 14px; text-decoration: none; white-space: nowrap;
    font-size: clamp(15px, 1.2vw, 19px); letter-spacing: .24em; margin-right: -.24em; }
  .cue svg { width: clamp(34px, 3vw, 52px); height: clamp(52px, 7vh, 80px); overflow: visible; animation: cue 2.4s cubic-bezier(.45, 0, .25, 1) infinite; }
  .cue .blk { fill: currentColor; stroke: none; }
  .cue path { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .cue:hover { color: var(--mi); }
  @keyframes cue { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(9px); } }
  /* the last plate is exactly one screen: at the end of the page it is seen whole, title to name, on any screen.
     It is three boxes: the title in its box, the ruled tables, and the studio's name in its box down to the foot of the sheet.
     The screen's spare height goes to the two boxes, and each word sits in the middle of its own box. If a screen is
     too short even so, the block is scaled down to fit (see fitClosing) */
  .pl.closing { display: flex; flex-direction: column; min-height: 100vh; min-height: 100svh; padding-bottom: var(--fi); }
  @media (min-width: 900px) { .pl.closing { padding-bottom: calc(var(--fi) + 29px); } }
  .closing .cl-in { flex: 1 0 auto; display: flex; flex-direction: column; }
  .closing .pl-top { flex: 1 1 auto; justify-content: center; margin-top: 0; padding: clamp(12px, 2.6vh, 36px) 0; }
  .closing .ttl { font-size: min(clamp(56px, 12.6vw, 232px), 17vh, calc((100vw - var(--gut) - 2 * var(--pad)) / (var(--ch, 10) * .38))); transform: translateY(-.045em); } /* the ink of the brackets and the y hangs low: lifted so it sits in the middle */
  .closing .tab.cl { flex: none; margin-top: 0; }
  .closing .sign { flex: none; }
  .closing .sign > div { padding-bottom: clamp(18px, 3.4vh, 40px); }
  .closing .sign .ref { padding-bottom: 8px; }
  .closing .giant { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; margin: 0; padding: clamp(16px, 3.2vh, 44px) 0;
    font-weight: 560; font-stretch: 62%; font-size: min(14.2vw, 19vh); line-height: .8; letter-spacing: -.02em; white-space: nowrap; text-align: center; }
  .closing .giant span { display: block; transform: translateY(.03em); }
  @media (min-width: 900px) { .closing .giant span { transform: translateY(-.04em); } }
  /* while the block is measured, the boxes take only what they need */
  .closing .cl-in.nat > * { flex: none !important; }

  /* ---------- diagrams in the same green line ---------- */
  .rings { position: relative; width: 100%; aspect-ratio: 682 / 300; }
  .rings svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .rings ellipse { fill: var(--blank); stroke: var(--mi); stroke-width: 1.6; transform-box: fill-box; transform-origin: center; }
  .rings .o { fill: none; stroke-dasharray: 5 5; }
  .rings .i { stroke-width: 2.6; }
  .rings span { position: absolute; left: 50%; transform: translate(-50%, -50%); color: var(--mi); opacity: 0; transition: opacity .4s ease; }
  .rings span.on { opacity: 1; }
  .mapw { width: 100%; }
  .map { position: relative; width: 100%; aspect-ratio: 1140 / 702; }
  .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map .ax { stroke: var(--mi); stroke-width: 1.4; fill: none; }
  .map .tk { stroke: var(--mi); stroke-width: 1.2; fill: none; transition: opacity .4s; }
  .map .op { fill: var(--blank); stroke: var(--mi); stroke-width: 1.4; stroke-dasharray: 5 5; transition: opacity .5s; }
  .map .d { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--mi); transform: translate(-50%, -50%) scale(0); transition: transform .45s cubic-bezier(.3, 1.6, .5, 1); }
  .map .d.b { background: var(--blank); border: 2px solid var(--mi); }
  .map .d.on { transform: translate(-50%, -50%) scale(1); }
  .map .pill2 { position: absolute; transform: translate(-50%, -50%); background: var(--blank); color: var(--mi); border: 1.5px solid var(--mi); border-radius: 999px; padding: 5px 10px; white-space: nowrap; font-size: clamp(9px, 1.3vw, 11px); opacity: 0; transition: opacity .4s; }
  .map .pill2.w { left: 0 !important; transform: translate(0, -50%); }
  .map .pill2.e { left: auto !important; right: 0; transform: translate(0, -50%); }
  .map .pill2.you { background: var(--mi); color: var(--blank); }
  .map .open { position: absolute; right: 2%; bottom: 7.5%; color: var(--mi); opacity: 0; transition: opacity .4s; }
  .map .pill2.on, .map .open.on { opacity: 1; }
  .mlg { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 16px; color: var(--mi); }
  .mlg span { display: inline-flex; align-items: center; gap: 8px; }
  .m { display: inline-block; width: 13px; height: 13px; border-radius: 50%; vertical-align: middle; flex: none; position: relative; z-index: 1; }
  .m.f { background: var(--mi); }
  .m.o { border: 2px solid var(--mi); background: var(--white); }
  .m.c { width: 17px; height: 17px; }
  .m.c svg, .so svg { width: 100%; height: 100%; display: block; }
  .tl { list-style: none; position: relative; margin-top: 2vh; }
  .tl::before { content: ""; position: absolute; left: 11px; top: 30px; bottom: 30px; width: 1px; background: var(--mi); }
  .tl li { position: relative; padding-left: 40px; }
  .tl .act { padding: 22px 0 4px 40px; }
  .tl .act:first-child { padding-top: 0; }
  .tl .ph { display: grid; grid-template-columns: clamp(92px, 9vw, 150px) 1fr; align-items: center; gap: 14px; padding: 4px 0; }
  .tl .ph::before { content: ""; position: absolute; left: 5px; top: 50%; width: 13px; height: 1px; background: var(--mi); }
  /* the small buildings: only the construction, in a fine line (no people, stamps or dense floor grid) */
  .tl .ico .grid { opacity: .2 !important; }
  .tl .ico .ppl, .tl .ico use.under, .tl .ico .gv, .tl .ico .labels { display: none; }
  .tl .ico { display: block; position: relative; height: clamp(70px, 7vw, 110px); }
  .tl .ph b { font-weight: 800; }
  .tl .ph i { font-style: normal; font-weight: 500; margin-right: .35em; }
  .tl .ph span { display: block; }
  .tl .so-r { height: 32px; display: flex; align-items: center; }
  .so { position: absolute; width: 21px; height: 21px; left: 1px; top: 50%; transform: translateY(-50%); }
  .tr { margin-top: 2vh; }
  .tr-h, .tr-r { display: grid; grid-template-columns: 1fr 44px 1fr; column-gap: 16px; }
  .tr-h span { padding-bottom: 10px; }
  .tr-h span:first-child, .tr-t { text-align: right; }
  .tr-r { align-items: center; }
  .tr-t, .tr-c { padding: 12px 0; }
  .tr-t i { display: block; font-style: normal; }
  .tr-m { position: relative; align-self: stretch; }
  .tr-m svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .tr-m path { fill: none; stroke: var(--mi); stroke-width: 1.6; }
  .tr-m .so { top: auto; bottom: 0; transform: translate(-50%, 50%); }
  .tr-m .so.l { left: 4px; } .tr-m .so.r { left: 40px; }
  .mx { width: 100%; border-collapse: collapse; margin-top: 2vh; table-layout: fixed; }
  .mx thead th { vertical-align: bottom; padding: 0 2px 10px; text-align: center; font-weight: 800; letter-spacing: .06em; font-size: 10px; overflow-wrap: anywhere; }
  .mx thead th:first-child { width: 34%; }
  .mx thead th.you { color: var(--mi); }
  .mx tbody th { text-align: left; font-weight: 500; padding: 9px 6px 9px 0; border-top: 1px solid var(--g0); }
  .mx tbody th i { font-style: normal; margin-right: .4em; }
  .mx td { text-align: center; border-top: 1px solid var(--g0); position: relative; }
  .mx td.ln::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--mi); }
  .mx tr:first-child td.ln::before { top: 50%; }
  .mx tr:last-child td.ln::before { bottom: 50%; }
  @media (max-width: 599px) { .mx thead th span { writing-mode: vertical-rl; transform: rotate(180deg); display: inline-block; white-space: nowrap; text-align: left; } }
